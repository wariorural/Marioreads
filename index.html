  drawQuotes();

  const addrow=el("div","qadd");
  /* A textarea, not a line: passages run long and wrap, and the field you
     cannot see the end of is the field you stop trusting. It borrows the note
     field's clothes — same border, same type — one size down, because notes
     are the longer form of the two. */
  const tx=el("textarea","notefield qfield"); tx.placeholder="Passage worth keeping";
  tx.setAttribute("aria-label","Quote");
  const row=el("div","qrow");
  const pg=el("input"); pg.type="number"; pg.min=1; pg.max=9999; pg.placeholder="p."; pg.inputMode="numeric";
  pg.setAttribute("aria-label","Page number");
  const go=el("button","act quiet"); go.textContent="Add quote";
  const commit=()=>{
    const v=tx.value.trim(); if(!v) return;
    (b.quotes=b.quotes||[]).push({page:pg.value?+pg.value:null, text:v});
    pg.value=""; tx.value=""; save(); render(); drawQuotes(); tx.focus();
  };
  go.onclick=commit;
  /* Enter files it, as it did when this was one line — losing the fast path
     would be the price of the bigger field. Shift+Enter is the break, the way
     every other box you type a paragraph into behaves. */
  tx.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); commit(); } };
  row.append(pg,go); addrow.append(tx,row); box.appendChild(addrow);
  return box;
}

/* ═══════════ editions ═══════════ */
async function openEditions(b){
  const w=el("div");
  const bar=el("div","optline"); bar.style.marginTop="16px";
  const hint=el("div","hint"); hint.textContent="Fetching editions …";
  const results=el("div"); results.style.marginTop="8px";
  w.append(bar,hint,results);
  openPanel("Choose edition",w);
  if(!b.ref){ hint.textContent="This book isn't linked to a catalog."; return; }

  let all=[];
  try{ all=await SOURCES[b.src].editions(b.ref); }catch(e){}
  if(!all.length){ hint.textContent="No editions found."; return; }

  const present=[...new Set(all.flatMap(e=>e.langs))].filter(l=>LANGS[l]);
  let filter = present.includes(prefLang) ? prefLang : "all";
  const seg=el("div","seg");
  [["all","All"],...present.map(l=>[l,LANGS[l]])].forEach(([k,lab])=>{
    const x=el("button"); x.textContent=lab; x.dataset.k=k;
    x.setAttribute("aria-pressed",String(k===filter));
    x.onclick=()=>{ filter=k; seg.querySelectorAll("button").forEach(y=>y.setAttribute("aria-pressed",String(y.dataset.k===k))); draw(); };
    seg.appendChild(x);
  });
  bar.appendChild(seg);

  function draw(){
    const list=(filter==="all"?all:all.filter(e=>e.langs.includes(filter)))
      .sort((a,c)=>(c.coverUrl?1:0)-(a.coverUrl?1:0));
    hint.textContent=`${list.length} editions`;
    results.innerHTML="";
    list.slice(0,40).forEach(e=>{
      const r=el("button","res");
      const th=el("div","th"); if(e.coverUrl) th.style.backgroundImage=`url(${e.coverUrl})`;
      const info=el("div");
      const sub=[e.langs.map(l=>LANGS[l]||l).join("/"),e.publisher,e.year,e.pages?e.pages+" pp.":null].filter(Boolean).join(" · ");
      info.innerHTML=`<div class="ti">${esc(e.title)}</div><div class="au">${esc(sub)}</div>`;
      const a=el("div","add"); a.textContent="→";
      r.append(th,info,a);
      r.onclick=async()=>{
        if(!b.origTitle) b.origTitle=b.title;
        b.title=e.title; b.lang=e.langs[0]||null;
        if(e.coverUrl){ b.coverUrl=e.coverUrl; b.coverBig=e.coverBig||e.coverUrl; }
        if(e.isbn) b.isbn=e.isbn;
        if(e.pages) b.pages=e.pages;
        if(e.year) b.year=e.year;
        if(e.publisher) b.publisher=e.publisher;
        const c=await extractColor(b.coverUrl); if(c) b.color=c;
        refresh(b); toast("Edition changed");
      };
      results.appendChild(r);
    });
  }
  draw();
}

/* ═══════════ search ═══════════ */
function searchPanel(prefill){
  const w=el("div");
  const box=el("div","searchin");
  const inp=el("input"); inp.placeholder="Title or ISBN"; inp.setAttribute("aria-label","Search for a book");
  if(prefill) inp.value=prefill;
  box.appendChild(inp);

  const opts=el("div","opts");
  const l1=el("div","optline"), l2=el("div","optline");
  const mk=(label,items,cur,fn)=>{
    const lab=el("span","lab"); lab.style.cssText="font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8b8b83;font-weight:600";
    lab.textContent=label;
    const seg=el("div","seg");
    items.forEach(([k,t])=>{
      const x=el("button"); x.textContent=t; x.dataset.k=k;
      x.setAttribute("aria-pressed",String(k===cur()));
      x.onclick=()=>{ fn(k); seg.querySelectorAll("button").forEach(y=>y.setAttribute("aria-pressed",String(y.dataset.k===k))); go(true); };
      seg.appendChild(x);
    });
    return [lab,seg];
  };
  l1.append(...mk("Edition in",[["nor","Norwegian"],["eng","English"],["any","Any"]],()=>prefLang,k=>{prefLang=k;saveSettings();}));
  l2.append(...mk("Catalog",[["ol","Open Library"],["gb","Google Books"]],()=>source,k=>{source=k;saveSettings();}));
  opts.append(l1,l2);

  const hint=el("div","hint"); hint.textContent="Type at least three characters";
  const results=el("div");
  /* Query field and result count are pinned; the language/catalog toggles are
     not — they are set once and cost 44px a row on touch, which would eat a
     third of the panel. A fragment, not a wrapper, so .pslot's padding and
     rule apply to the head's own box. */
  const head=document.createDocumentFragment();
  head.append(box,hint);
  w.append(opts,results);
  openPanel("Add book",w,head);
  setTimeout(()=>inp.focus(),380);

  let timer;
  async function go(now){
    clearTimeout(timer);
    const q=inp.value.trim(); lastQuery=q;
    if(q.length<3){ results.innerHTML=""; hint.textContent="Type at least three characters"; return; }
    hint.textContent = isIsbn(q) ? "Looking up ISBN …" : "Searching …";
    timer=setTimeout(async()=>{
      try{
        let hits=await SOURCES[source].search(q), from=source;
        /* Neither catalog is complete — Open Library is thin on small European
           publishers, Google Books is thin on older and self-published work.
           Rather than make the reader work that out and flip the toggle, try
           the other one and say which answered. */
        if(!hits.length){
          const other = source==="ol" ? "gb" : "ol";
          try{ const alt=await SOURCES[other].search(q); if(alt.length){ hits=alt; from=other; } }catch(e){}
        }
        results.innerHTML="";
        hits.forEach(h=>results.appendChild(resultRow(h)));
        if(hits.length) hint.textContent = from===source
          ? `${hits.length} results in ${SOURCES[from].label}`
          : `Nothing in ${SOURCES[source].label} — ${hits.length} in ${SOURCES[from].label}`;
        else {
          hint.textContent="Neither catalog has it.";
          results.appendChild(manualOffer(q));
        }
        $("#panel").scrollTop=0;      // a new result set starts at its own top
      }catch(e){
        hint.textContent=`No response from ${SOURCES[source].label}. Try the other catalog.`;
      }
    }, now?0:340);
  }
  inp.oninput=()=>go();
  if(prefill) go(true);
}
$("#openSearch").onclick=()=>searchPanel();

/* A search hit needs three shelf buttons, and buttons can't nest, so the row
   is a div: the title is one button covering the whole row for the default
   add, the shelf buttons sit on top of it. One delegated listener serves
   both, since the row button carries an empty data-shelf. */
function resultRow(hit){
  const r=el("div","res pick");
  r.setAttribute("role","group");
  r.setAttribute("aria-label",hit.title);

  const th=el("div","th"); th.setAttribute("aria-hidden","true");
  if(hit.coverUrl) th.style.backgroundImage=`url(${hit.coverUrl})`;

  const sub=[hit.author,hit.year,hit.lang?(LANGS[hit.lang]||hit.lang):null].filter(Boolean).join(" · ");
  /* No "+" glyph here any more: with three labelled shelves right below it,
     a plus whose destination depends on the open tab is the implicit guess
     this change exists to remove. Tapping the row still adds — it just
     doesn't advertise a shelf it can't name. */
  const hitbtn=el("button","reshit"); hitbtn.dataset.shelf="";
  hitbtn.innerHTML=`<span class="info"><span class="ti">${esc(hit.title)}</span>`+
    `<span class="au">${esc(sub)}</span></span>`;
  hitbtn.setAttribute("aria-label",`Add “${hit.title}” to ${VIEWS[defaultShelf()]}`);

  const picks=el("div","shelfpick");
  SHELF_PICKS.forEach(([k,t])=>{
    const x=el("button","act quiet"); x.textContent=t; x.dataset.shelf=k;
    x.setAttribute("aria-label",`Add “${hit.title}” to ${VIEWS[k]}`);
    picks.appendChild(x);
  });

  r.append(th,hitbtn,picks);
  r.addEventListener("click",e=>{
    const btn=e.target.closest("[data-shelf]"); if(!btn) return;
    lastEntry="search";
    addBook(hit, btn.dataset.shelf||defaultShelf());
  });
  return r;
}

const SHELF_PICKS=[["toread","To read"],["reading","Reading now"],["read","Read"]];

/* Some books are in no catalogue at all — small presses especially. Offered
   only after both have been asked and come back empty, so it reads as the
   last resort it is rather than a competing path. */
function manualOffer(q){
  const w=el("div","manualoffer");
  const p=el("div","hint"); p.style.marginTop="0";
  p.textContent="Small presses often sit in neither. You can enter it yourself.";
  const b=el("button","act"); b.textContent="Enter it by hand";
  b.onclick=()=>manualPanel(q);
  w.append(p,b);
  return w;
}

function manualPanel(q){
  const w=el("div","manualform");
  const fields={};
  /* An ISBN typed into search is an ISBN, not a title — put it where it goes. */
  const isbnSeed = isIsbn(q||"") ? q.replace(/\D/g,"") : "";
  [["title","Title","text"],["author","Author","text"],["pages","Pages","number"],

  const err=el("div","hint"); err.style.color="var(--signal)"; err.hidden=true;
  const picks=el("div","acts");

  setTimeout(()=>fields[isbnSeed?"title":"author"].focus(),380);
}
const defaultShelf = () => (view==="rec"||!VIEWS[view]) ? "toread" : view;

async function addBook(hit, shelf){
  const target = shelf || defaultShelf();
  const b={
    id:uid(), title:hit.title, origTitle:null, author:hit.author, year:hit.year, pages:hit.pages,
    isbn:hit.isbn, lang:hit.lang, publisher:hit.publisher||null,
    coverUrl:hit.coverUrl, coverBig:hit.coverBig||hit.coverUrl, ref:hit.ref, src:hit.source,
    blurb:hit.blurb||null, shelf: target, rec: view==="rec",
    gaveUp:false, upNext:false, page:0,
    started: target==="reading" ? today() : null,
    finished:null,
    /* Seed the year, not the date: most books are logged long after they were
       read, and "finished today" would be a lie. The year is enough to file
       it under the right heading, and the field is right there to correct. */
    finishedYear: target==="read" ? String(new Date().getFullYear()) : null,
    addedAt:today(), color:fallbackColor(hit.title), note:"", quotes:[]
  };
  books.push(b); render(); save();
  justAdded=b.id;
  openBook(b,null);                    // land on the book, dates ready to fill
  toast(`Added to ${VIEWS[b.shelf]}`, ()=>undoAdd(b));
  await enrichNewBook(b);
}

function undoAdd(b){
  books=books.filter(x=>x.id!==b.id);
  if(justAdded===b.id) justAdded=null;
  save(); render();
  // editing a book that is no longer in the array would silently lose the edit
  if($("#pbody").querySelector(`[data-cover="${b.id}"]`)) closePanel();
}

/* Swap in the preferred-language edition and pull the cover colour, then
   patch whatever panel is open. No toast: it would replace the one carrying
   Undo, and the panel shows the change plainly enough by itself. */
async function enrichNewBook(b){
  if(prefLang!=="any" && b.ref && SOURCES[b.src].canEditions && b.lang!==prefLang){
    try{
      const eds=await SOURCES[b.src].editions(b.ref);
      const inLang=eds.filter(e=>e.langs.includes(prefLang));
      const pick=inLang.find(e=>e.coverUrl&&e.pages)||inLang.find(e=>e.coverUrl)||inLang[0];
      if(pick){
        b.origTitle=b.title; b.title=pick.title; b.lang=prefLang;
        if(pick.coverUrl){ b.coverUrl=pick.coverUrl; b.coverBig=pick.coverBig||pick.coverUrl; }
        if(pick.isbn) b.isbn=pick.isbn;
        if(pick.pages) b.pages=pick.pages;
        if(pick.publisher) b.publisher=pick.publisher;
      }
    }catch(e){}
  }
  const c=await extractColor(b.coverUrl); if(c) b.color=c;
  if(!books.includes(b)) return;       // undone while we were fetching
  render(); save(); patchDetail(b);
}

/* ═══════════ EAN-13 ═══════════
   Safari has never shipped BarcodeDetector, on any platform, so on an iPhone
   the scanner was only ever the "not supported" message — the camera never
   opened. Every book barcode is EAN-13, and that one format is small enough
   to decode here rather than make the offline shell carry a library.

   A digit is 7 modules wide, written as the widths of its four runs. The left
   half reads light-first, the right half dark-first with the same widths, and
   whether a left digit used the table or its reverse spells out the first
   digit — that is what the parity table below decodes. */
const EAN_L=[[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],
             [1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
const EAN_FIRST=[0x00,0x0B,0x0D,0x0E,0x13,0x19,0x1C,0x15,0x16,0x1A];

/* How far the measured runs may drift from the ideal before we call it a
   mismatch — printed barcodes on curved paperback covers need the slack. */
function patternOff(counts,pattern,maxVar){
  let total=0,patTotal=0;
  for(let i=0;i<counts.length;i++){ total+=counts[i]; patTotal+=pattern[i]; }
  if(total<patTotal) return Infinity;
  const unit=total/patTotal, slack=unit*maxVar;
  let off=0;
  for(let i=0;i<counts.length;i++){
    const d=Math.abs(counts[i]-pattern[i]*unit);
    if(d>slack) return Infinity;
    off+=d;
  }
  return off/total;
}

function bestDigit(counts,reversible){
  let best=-1,bestOff=0.48;                  // anything worse is not a digit
  for(let d=0;d<10;d++){
    let off=patternOff(counts,EAN_L[d],0.7);
    if(off<bestOff){ bestOff=off; best=d; }
    if(reversible){
      off=patternOff(counts,EAN_L[d].slice().reverse(),0.7);
      if(off<bestOff){ bestOff=off; best=d+10; }   // +10 marks even parity
    }
  }
  return best;
}

/* One horizontal line of the frame, as alternating dark/light run lengths. */
function lineRuns(gray){
  let mn=255,mx=0;
  for(let i=0;i<gray.length;i++){ if(gray[i]<mn)mn=gray[i]; if(gray[i]>mx)mx=gray[i]; }
  if(mx-mn<48) return null;                  // flat line: no barcode here
  const th=(mn+mx)/2, runs=[];
  let dark=gray[0]<th, n=0;
  for(let i=0;i<gray.length;i++){
    const d=gray[i]<th;
    if(d===dark) n++; else { runs.push(n); dark=d; n=1; }
  }
  runs.push(n);
  return {runs, firstDark:gray[0]<th};
}

function decodeAt(runs,start){
  let i=start+3;                             // past the 101 start guard
  const digits=[]; let parity=0;
  for(let d=0;d<6;d++){
    if(i+4>runs.length) return null;
    const v=bestDigit(runs.slice(i,i+4),true);
    if(v<0) return null;
    digits.push(v%10);
    if(v>=10) parity|=1<<(5-d);
    i+=4;
  }
  if(i+5>runs.length) return null;
  if(patternOff(runs.slice(i,i+5),[1,1,1,1,1],0.7)===Infinity) return null;  // 01010
  i+=5;
  for(let d=0;d<6;d++){
    if(i+4>runs.length) return null;
    const v=bestDigit(runs.slice(i,i+4),false);
    if(v<0) return null;
    digits.push(v);
    i+=4;
  }
  const first=EAN_FIRST.indexOf(parity);
  if(first<0) return null;
  const code=String(first)+digits.join("");
  let sum=0;
  for(let k=0;k<12;k++) sum+=(+code[k])*(k%2?3:1);
  if((10-sum%10)%10 !== +code[12]) return null;   // check digit
  return code;
}

function decodeLine(gray){
  for(const flip of [false,true]){
    const g = flip ? Uint8Array.from(gray).reverse() : gray;
    const r=lineRuns(g); if(!r) continue;
    const {runs,firstDark}=r;
    for(let i=firstDark?0:1;i<runs.length-30;i+=2){    // only ever start on a dark run
      if(patternOff(runs.slice(i,i+3),[1,1,1],0.7)===Infinity) continue;
      const code=decodeAt(runs,i);
      if(code) return code;
    }
  }
  return null;
}

/* Sample a spread of lines across the middle of the frame — the barcode only
   has to cross one of them, which is what makes aiming forgiving. */
function scanFrame(video,cv,cx){
  const vw=video.videoWidth, vh=video.videoHeight;
  if(!vw||!vh) return null;
  const W=Math.min(800,vw), H=Math.max(1,Math.round(vh*(W/vw)));
  cv.width=W; cv.height=H;
  cx.drawImage(video,0,0,W,H);
  const d=cx.getImageData(0,0,W,H).data, gray=new Uint8Array(W);
  for(let k=-7;k<=7;k++){
    const y=Math.round(H/2 + k*H*0.035);
    if(y<0||y>=H) continue;
    for(let x=0;x<W;x++){ const p=(y*W+x)*4; gray[x]=(d[p]*77+d[p+1]*151+d[p+2]*28)>>8; }
    const code=decodeLine(gray);
    if(code) return code;
  }
  return null;
}

function stopCam(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

$("#openScan").onclick=async()=>{
  const w=el("div");
  const hint=el("div","hint"); hint.style.marginTop="18px";
  const manual=el("div","searchin");
  const inp=el("input"); inp.placeholder="ISBN"; inp.inputMode="numeric"; inp.setAttribute("aria-label","Type ISBN");
  manual.appendChild(inp);
  const go=el("button","act sig"); go.textContent="Look up"; go.style.marginTop="14px";
  go.onclick=()=>{ const v=inp.value.trim(); if(v.replace(/\D/g,"").length>=10){ stopCam(); searchPanel(v); } };
  const video=el("video"); video.id="cam"; video.setAttribute("playsinline",""); video.muted=true;
  w.append(hint,video,manual,go);
  openPanel("Scan barcode",w);

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    hint.textContent="No camera available here. Type the ISBN below.";
    video.remove(); inp.focus(); return;
  }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
    video.srcObject=camStream; await video.play();
    hint.textContent="Hold the barcode on the back of the book up to the camera";

    /* Use the platform decoder where there is one, and fall back to ours where
       there is not — which is every Safari. Both feed the same handler. */
    let det=null;
    if("BarcodeDetector" in window){
      try{
        const ok=await BarcodeDetector.getSupportedFormats();
        const formats=["ean_13","ean_8"].filter(f=>ok.includes(f));
        if(formats.length) det=new BarcodeDetector({formats});
      }catch(e){}
    }
    const cv=el("canvas"), cx=cv.getContext("2d",{willReadFrequently:true});
    const found=v=>{
      if(!v || v.replace(/\D/g,"").length<8) return false;
      stopCam(); toast("Scanned "+v); searchPanel(v); return true;
    };
    let misses=0;
    const tick=async()=>{
      if(!camStream) return;
      try{
        if(det){ const codes=await det.detect(video); if(codes.length && found(codes[0].rawValue)) return; }
        else if(found(scanFrame(video,cv,cx))) return;
      }catch(e){}
      /* Ours reads a whole frame, so it runs on a timer rather than every
         animation frame — often enough to feel instant, cheap enough not to
         cook the phone while you line the book up. */
      if(++misses===60) hint.textContent="Still looking — try more light, or hold it a little further back";
      setTimeout(tick, det?60:120);
    };
    tick();
  }catch(e){
    hint.textContent = e && e.name==="NotAllowedError"
      ? "Camera access was declined. Type the ISBN below instead."
      : "Couldn't access the camera here. Type the ISBN below instead.";
    video.remove(); inp.focus();
  }
};

function probeImg(url){
  return new Promise(res=>{
    const i=new Image(); const t=setTimeout(()=>res({ok:false,msg:"timed out"}),8000);
    i.onload=()=>{clearTimeout(t);res({ok:true,msg:"loaded"});};
    i.onerror=()=>{clearTimeout(t);res({ok:false,msg:"blocked"});};
    i.src=url+"?cb="+Date.now();
  });
}
async function probeFetch(url){
  try{
    const r=await fetch(url,{cache:"no-store"});
    return r.ok ? {ok:true,msg:"HTTP "+r.status} : {ok:false,msg:"HTTP "+r.status};
  }catch(e){
    const m=String(e&&e.message||e);
    return {ok:false, msg: /Failed to fetch|NetworkError|Load failed/i.test(m) ? "blocked" : m.slice(0,40)};
  }
}

/* Tiny CSV parser: handles quoted cells, escaped quotes and newlines inside quotes. */
function parseCSV(text){
  const rows=[]; let row=[], cell="", inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(inQ){
      if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else inQ=false; }
      else cell+=ch;
    } else if(ch==='"') inQ=true;
    else if(ch===','){ row.push(cell); cell=""; }
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n') i++;
      row.push(cell); cell="";
      if(row.length>1||row[0].trim()!=="") rows.push(row);
      row=[];
    } else cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); if(row.length>1||row[0].trim()!=="") rows.push(row); }
  return rows;
}

/* Map a reading-list CSV export onto the app's book shape. Understands the
   Reading List app (iOS), Goodreads and StoryGraph, and falls back to any
   CSV with a title column. Returns null if no title column is found. */
function csvToBooks(text){
  const rows=parseCSV(text);
  if(rows.length<2) return null;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>-1) return i; } return -1; };
  const iTitle=col("title","tittel");
  if(iTitle<0) return null;
  const iSubtitle=col("subtitle"),
        iAuthor=col("author","authors","forfatter"),
        iIsbn13=col("isbn13","isbn-13","isbn/uid"), iIsbn=col("isbn"),
        iPages=col("number of pages","page count","pages","sider"),
        iPage=col("current page"),
        iShelf=col("exclusive shelf","read status","shelf","status","hylle"),
        iShelves=col("bookshelves","lists","tags"),
        iStarted=col("started reading","date started"),
        iFinished=col("finished reading"),
        iDnf=col("did not finish"),
        iDateRead=col("date read","last date read","dates read"),
        iDateAdded=col("date added"),
        iYear=col("original publication year","year published"),
        iPubDate=col("publication date"),
        iPublisher=col("publisher"),
        iLang=col("language code","language"),
        iDesc=col("description");
  const cleanIsbn=v=>{ const d=String(v||"").replace(/[^0-9Xx]/g,""); return d.length>=10?d:null; };
  const cleanDate=v=>{ const m=String(v||"").match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
    return m?`${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`:null; };
  const yearOf=v=>(String(v||"").match(/\d{4}/)||[null])[0];
  const unentity=v=>String(v||"").replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&amp;/g,"&");
  const flipName=v=>{ // "Lem, Stanisław" -> "Stanisław Lem"; first author only
    const first=String(v||"").split(";")[0].trim();
    const m=first.match(/^([^,]+),\s*(.+)$/);
    return m?`${m[2]} ${m[1]}`.trim():first;
  };
  const LANGMAP={en:"eng",no:"nor",nb:"nob",nn:"nno",sv:"swe",da:"dan",de:"ger",fr:"fre",es:"spa",it:"ita"};
  return rows.slice(1).filter(r=>(r[iTitle]||"").trim()).map(r=>{
    const get=i=>i>-1?(r[i]||"").trim():"";
    const sv=get(iShelf).toLowerCase(), extra=get(iShelves).toLowerCase();
    const started=cleanDate(get(iStarted)), finishedDate=cleanDate(get(iFinished))||null;
    const listYear=iShelves>-1?yearOf((get(iShelves).match(/(?:^|,)\s*(\d{4})\s*(?:\(|,|$)/)||[])[1]):null;
    let shelf="toread", gaveUp=false, finished=null, finishedYear=null;
    if(/abandon|dnf|did-not-finish|gave up|gitt opp/.test(sv+" "+extra)||get(iDnf)){
      shelf="read"; gaveUp=true; finished=finishedDate||cleanDate(get(iDnf))||cleanDate(get(iDateRead));
    } else if(finishedDate){ shelf="read"; finished=finishedDate; }
    else if(/currently|leser/.test(sv)||(started&&!finishedDate)) shelf="reading";
    else if(/to-read|to read|want|skal/.test(sv)) shelf="toread";
    else if(/read|finished|lest/.test(sv)){ shelf="read"; finished=cleanDate(get(iDateRead)); }
    else if(listYear){ shelf="read"; finishedYear=listYear; }
    if(shelf==="read"&&!finished&&!finishedYear)
      finishedYear=yearOf(get(iDateRead))||listYear;
    const subtitle=get(iSubtitle);
    return {
      title:get(iTitle)+(subtitle?": "+subtitle:""),
      author:flipName(get(iAuthor))||"Unknown",
      isbn:cleanIsbn(get(iIsbn13))||cleanIsbn(get(iIsbn)),
      pages:parseInt(get(iPages),10)||260,
      page:parseInt(get(iPage),10)||0,
      year:yearOf(get(iYear))||yearOf(get(iPubDate)),
      publisher:get(iPublisher)||null,
      lang:LANGMAP[get(iLang).toLowerCase()]||get(iLang).toLowerCase()||null,
      blurb:iDesc>-1&&get(iDesc)?unentity(get(iDesc)).slice(0,620):null,
      shelf, gaveUp, finished, finishedYear,
      started:started||(shelf==="reading"?today():null),
      addedAt:cleanDate(get(iDateAdded))||started||finished||(finishedYear?finishedYear+"-06-01":null)||today()
    };
  });
}

/* ═══════════ finding covers ═══════════
   A catalogue record is not a picture. Open Library returns a cover id only
   when it holds a jacket, so a book can be perfectly well linked and still
   have none — and the old filter here, !coverUrl && !ref, skipped exactly
   those, on the grounds that they had a ref. They are the whole point of a
   sweep. Which catalogue to ask follows from that too: re-asking the one that
   just said it had no picture returns the same empty record, so ask the other. */
const otherSrc = s => s==="ol" ? ["gb"] : s==="gb" ? ["ol"] : ["ol","gb"];
const coverless = () => books.filter(b=>!b.coverUrl);

async function findCovers(limit=40){
  const missing=coverless().slice(0,limit);
  let dirty=0, found=0;
  for(const b of missing){
    const q = b.isbn || `${b.title} ${b.author}`;
    let hit=null;
    for(const s of otherSrc(b.src)){
      /* Scoped to the one lookup: a catalogue failing is not the book failing,
         and a book failing is not the run failing. A 429 from Google Books
         partway through has to leave both the other catalogue and the rest of
         the shelf their chance. */
      try{
        const hits=await SOURCES[s].search(q);
        /* Only a hit that actually carries a jacket. Taking the first result
           regardless — what this used to do — buys nothing and costs the
           book's identity, since the fields below get overwritten from it. */
        hit=hits.find(h=>h.coverUrl);
        if(hit){ hit.__src=s; break; }
      }catch(e){}
    }
    if(!hit) continue;
    try{
      b.coverUrl=hit.coverUrl; b.coverBig=hit.coverBig||hit.coverUrl;
      /* A book that already has a catalogue record keeps it: this pass is
         looking for a picture, and a search matched on title and author is
         not good enough evidence to requalify a book that was already
         identified. Only a book with nothing to lose gets its record filled. */
      if(!b.ref){
        b.ref=hit.ref; b.src=hit.__src;
        if(!b.isbn) b.isbn=hit.isbn;
        if(!b.year) b.year=hit.year;
      }
      const c=await extractColor(b.coverUrl); if(c) b.color=c;
      found++;
      if(++dirty%8===0){ render(); save(); }   // batched, or the shelf redraws once per fetch
    }catch(e){}
  }
  if(dirty){ render(); save(); }
  return {found, tried:missing.length};
}

$("#importfile").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const text=(await f.text()).replace(/^\uFEFF/,"");
    let data;
    if(/\.csv$/i.test(f.name)||!/^\s*[\[{]/.test(text)){
      data=csvToBooks(text);
      if(!data) throw new Error("no title column");
    } else {
      data=JSON.parse(text);
    }
    if(!Array.isArray(data)) throw new Error("not a list");
    const backup=books.slice();
    const seen=new Set(books.map(b=>(b.isbn||b.title)+"|"+b.author));
    let added=0;
    data.forEach(b=>{
      const k=(b.isbn||b.title)+"|"+b.author;
      if(seen.has(k)) return;
      seen.add(k);
      /* Defaults first, so a re-imported export that carries upNext keeps it. */
      books.push(Object.assign({id:uid(), rec:false, upNext:false, gaveUp:false, page:0, addedAt:today(),
        note:"", quotes:[], color:fallbackColor(b.title||"?")}, b, {id:uid()}));
      added++;
    });
    await save(); render();
    toast(`${added} books imported`, ()=>{ books=backup; save(); render(); });
    if(added) findCovers();
  }catch(err){ toast("Invalid file"); }
  e.target.value="";
};
$("#findcovers").onclick=async e=>{
  const btn=e.target;
  if(btn.disabled) return;
  btn.disabled=true; btn.textContent="Looking …";
  const {found,tried}=await findCovers();
  btn.disabled=false;
  render();                       // recounts the label, or hides it if none are left
  toast(found ? `${found} of ${tried} covers found` : `No covers found for ${tried}`);
};
$("#wipe").onclick=async()=>{
  if(!books.length){ toast("The shelf is already empty"); return; }
  const backup=books.slice();
  books=[]; await save(); render();
  toast(`${backup.length} books cleared`, ()=>{ books=backup; save(); render(); });
};

/* ═══════════ start ═══════════ */
(async()=>{
  if(STORE_KIND==="mem") $("#storenote").textContent="Storage off · export before you close";
  await load();
  render();
  moveRail();
  if("serviceWorker" in navigator){
    try{ await navigator.serviceWorker.register("./sw.js"); }catch(e){}
  }
})();
</script>
