<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bookshelf</title>
<meta name="description" content="A reading list without frills.">
<meta name="theme-color" content="#EFEFEA">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- "default" makes iOS reserve an opaque band above the web view and paint it
     system grey, ignoring theme-color below; "black-translucent" hands that
     strip back to the page, so the paper and its dot grid run under the clock.
     .wrap already pads by safe-area-inset-top, which is what keeps the wordmark
     clear of it — that padding was inert until this line changed. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookshelf">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#EFEFEA;--ink:#111110;--rule:#C9C9C2;--grid:#E3E3DC;--signal:#FF3B00;--gut:20px;
  /* One height for every control in the app. Buttons and fields used to set
     their own padding, which is why nothing lined up. Raised on touch below. */
  --ctl:34px;--ctl-pad:13px;--ctl-field:150px;
  /* The measure of the panel's control column, derived rather than picked: the
     three date fields side by side. Everything you operate lines up with them
     instead of running the full width of a desktop panel. */
  --ctl-col:calc(var(--ctl-field)*3 + 16px);
  /* Paper texture. A 1px dot has none of the continuity the eye integrates
     along a hairline, and at this size antialiasing eats most of it on a 1×
     screen — so the individual dot has to be well darker than the old rules
     were, even though the field reads far lighter than they did. */
  --dot:rgba(17,17,16,.22);--dotgap:30px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ── the control system ──────────────────────────────────────────────────
   Every button and every text field is exactly --ctl tall. appearance:none
   is what stops iOS imposing its own intrinsic height and rounded corners;
   inline-flex with line-height:1 is what makes a <button> and an <input>
   land on the same metrics. Type sizes stay per-component. */
.btn,.act,.tog,.datefix input,.qadd input,.manualform input{height:var(--ctl);line-height:1;
  -webkit-appearance:none;appearance:none;border-radius:0}
.btn,.act,.tog{padding:0 var(--ctl-pad);display:inline-flex;align-items:center;
  justify-content:center;white-space:nowrap}
/* A button that never states a colour falls through to the UA's, and that is
   not the same everywhere: Chromium gives pure black, iOS Safari gives the
   system blue. The register rows are plain buttons, so they read blue on the
   phone and black on the desktop. Inherit instead — every component that
   wants its own colour already says so, and outranks this. */
button{color:inherit}
/* background-color, not the shorthand — the shorthand would reset the image */
body{background-color:var(--paper);
  background-image:radial-gradient(circle at 1px 1px,var(--dot) .5px,transparent .9px);
  background-size:var(--dotgap) var(--dotgap);
  color:var(--ink);font-family:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:"DM Mono","SFMono-Regular",Menlo,monospace;font-size:11px;letter-spacing:.02em}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;
  padding:env(safe-area-inset-top) calc(var(--gut) + env(safe-area-inset-right))
          calc(40px + env(safe-area-inset-bottom)) calc(var(--gut) + env(safe-area-inset-left))}

header{padding:22px 0 14px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
/* Two stacked lines filling exactly one control height, so the wordmark's ink
   starts and ends on the buttons' edges. text-box trims the box to the cap
   height and the baseline, which is the only way to align to the letters
   rather than to the line box — and it uses the real metrics of whichever
   font won, so it stays right when Archivo swaps in over the fallback.
   Without support it degrades to the box alignment the height gives. */
.mark{font-weight:800;font-variation-settings:"wdth" 118;letter-spacing:-.02em;
  text-transform:uppercase;font-size:calc(var(--ctl)*.625);line-height:calc(var(--ctl)*.55);
  height:var(--ctl);text-box:trim-both cap alphabetic}
.adds{display:flex;gap:0}
.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;
  font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  cursor:pointer;transition:background .16s,color .16s;white-space:nowrap}
.btn+.btn{border-left:0}
.btn:hover,.btn:focus-visible{background:var(--ink);color:var(--paper)}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn.fill:hover{background:var(--signal);border-color:var(--signal)}

nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);
  border-bottom:1px solid var(--rule)}
nav button{appearance:none;background:none;border:0;border-right:1px solid var(--rule);font-family:inherit;
  color:#8b8b83;cursor:pointer;text-align:left;padding:8px 9px 7px;display:block;min-width:0;transition:color .2s}
nav button:last-child{border-right:0}
nav b{display:block;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;
  font-variation-settings:"wdth" 76;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav .n{display:block;font-family:"DM Mono",monospace;font-size:13px;margin-top:3px;opacity:.6}
nav button[aria-selected="true"]{color:var(--ink)}
nav button[aria-selected="true"] .n{opacity:1}
.railwrap{height:2px;position:relative}
.rail{position:absolute;top:0;height:2px;background:var(--ink);
  transition:left .42s cubic-bezier(.16,1,.3,1),width .42s cubic-bezier(.16,1,.3,1)}

.bar{display:flex;align-items:center;gap:14px;padding:10px 0 2px;flex-wrap:wrap}
.bar .lab{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#8b8b83;font-weight:600}
.seg{display:flex;gap:13px;align-items:center;min-height:var(--ctl)}
.seg button{position:relative;appearance:none;background:none;border:0;font-family:inherit;cursor:pointer;font-size:9px;
  font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#a3a39b;padding:2px 0;
  border-bottom:1px solid transparent}
/* The label is 9px and the underline has to stay welded to it, so the tap
   target is a transparent band instead of padding — a hit on a pseudo counts
   as a hit on its element. .seg reserves the band's height so it can't hang
   over the filter input when the bar wraps on narrow screens. */
.seg button::before{content:"";position:absolute;left:-6px;right:-6px;top:50%;
  height:var(--ctl);transform:translateY(-50%)}
.seg button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
/* A label and the segment it names wrap as one piece. Loose in .bar they wrap
   independently, which strands "View" at the end of the order row with its own
   buttons on the line below. */
.segbox{display:flex;align-items:center;gap:14px}
.segbox[hidden]{display:none}
/* One control on its own line, above the books, on the shelf's right edge */
.pickrow{display:flex;justify-content:flex-end;padding-top:14px}
.filter{margin-left:auto;display:flex;align-items:center;gap:7px;min-width:120px;flex:1;max-width:230px}
.filter input{flex:1;border:0;border-bottom:1px solid var(--rule);background:none;font-family:inherit;
  font-size:11px;letter-spacing:.06em;padding:4px 0;color:var(--ink);text-transform:uppercase;font-weight:600}
.filter input:focus{outline:none;border-bottom-color:var(--ink)}
.filter input::placeholder{color:#b6b6ae;letter-spacing:.14em}

.stack{padding-top:14px}
.rowwrap{margin-bottom:24px}
.rowbooks{display:flex;align-items:flex-end;gap:3px;min-height:56px}
.rowline{height:1px;background:var(--ink);position:relative}
.rowmeta{position:absolute;right:0;top:5px;font-family:"DM Mono",monospace;font-size:9.5px;color:#b6b6ae}
.shelflabel{position:absolute;left:0;top:6px;font-size:9px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;font-variation-settings:"wdth" 76;color:#8b8b83;white-space:nowrap;background:var(--paper);padding-right:8px}
/* The one structural mark that says the shelf row ends here — it carries the accent */
.bookend{flex:0 0 auto;width:6px;background:var(--signal);align-self:flex-end}

.spine{position:relative;flex:0 0 auto;cursor:pointer;border:0;padding:0;display:block;
  transition:transform .34s cubic-bezier(.16,1,.3,1),opacity .28s;transform-origin:bottom center}
.spine:hover,.spine:focus-visible{transform:translateY(-13px)}
.spine:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.spine.dim{opacity:.13}
.spine .body{width:100%;height:100%;position:relative;display:flex;align-items:center;
  justify-content:center;overflow:hidden}
.spine .body::before,.spine .body::after{content:"";position:absolute;left:0;right:0;height:1px;background:rgba(255,255,255,.42)}
.spine .body::before{top:9px}.spine .body::after{bottom:9px}
.spine .t{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;font-variation-settings:"wdth" 80;white-space:nowrap;
  overflow:hidden;max-height:calc(100% - 34px);padding:2px}
.spine .prog{position:absolute;left:0;bottom:0;height:2px;background:var(--signal)}
.spine .star{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:3px;height:3px;
  background:rgba(255,255,255,.9);border-radius:50%}
/* Up next takes the accent at the head of the spine — the same band the
   progress bar uses at the foot, so the two can never be read as each other. */
.spine .pin{position:absolute;left:0;right:0;top:0;height:3px;background:var(--signal)}
.spine[data-narrow="1"] .t{display:none}
.spine.gave .body{filter:saturate(.18)}

.yearhead{display:flex;align-items:baseline;gap:12px;padding:26px 0 6px;border-top:1px solid var(--rule);margin-top:12px}
.yearhead .y{font-weight:800;font-variation-settings:"wdth" 125;font-size:clamp(30px,9vw,52px);
  letter-spacing:-.045em;line-height:.85}
.yearhead .c{font-family:"DM Mono",monospace;font-size:10px;color:#8b8b83}

.reg{border-top:1px solid var(--ink)}
.regrow{display:grid;grid-template-columns:26px 1fr auto;gap:10px;padding:11px 0;border-bottom:1px solid var(--rule);
  align-items:baseline;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;
  font-family:inherit;cursor:pointer}
.regrow:hover{background:rgba(17,17,16,.035)}
.regrow .idx{font-family:"DM Mono",monospace;font-size:10px;color:#a3a39b}
.regrow .ti{font-size:14px;font-weight:700;line-height:1.15}
.regrow .au{font-size:11px;color:#6a6a63;margin-top:3px}
.regrow .dt,.res .dt{font-family:"DM Mono",monospace;font-size:10px;color:#6a6a63;text-align:right;white-space:nowrap}
.regrow.gave .ti{color:#8b8b83;font-weight:500}
.regrow.gave .idx,.regrow.gave .dt{color:#a3a39b}
.tagx{display:inline-block;border:1px solid var(--rule);padding:1px 5px;margin-left:6px;font-size:8px;
  font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8b8b83;vertical-align:1px}
.tagx.now{border-color:var(--signal);color:var(--signal)}

.stats{border-top:1px solid var(--ink);display:grid;grid-template-columns:repeat(3,1fr);margin-top:20px}
.stat{padding:11px 10px 16px;border-right:1px solid var(--rule)}
.stat:last-child{border-right:0}
.stat .v{font-weight:800;font-variation-settings:"wdth" 125;font-size:clamp(24px,7vw,40px);
  line-height:.82;letter-spacing:-.045em}
.stat .k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#6a6a63;margin-top:8px;
  font-variation-settings:"wdth" 80;font-weight:600}

.empty{padding:34px 0 10px;max-width:320px}
.empty b{display:block;font-weight:800;font-variation-settings:"wdth" 118;font-size:20px;
  text-transform:uppercase;letter-spacing:-.02em;margin-bottom:5px}
.empty p{font-size:13px;color:#6a6a63}
.foot{margin-top:38px;padding-top:12px;border-top:1px solid var(--rule);display:flex;gap:16px;flex-wrap:wrap}
.foot button{appearance:none;background:none;border:0;font-family:inherit;font-size:9px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;color:#a3a39b;cursor:pointer}
.foot button:hover{color:var(--ink)}
.storenote{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--signal);font-weight:700}
.diag{margin-top:18px;border-top:1px solid var(--ink)}
.diagrow{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.diagrow .nm{font-size:12px;font-weight:700}
.diagrow .ur{font-family:"DM Mono",monospace;font-size:9.5px;color:#a3a39b;margin-top:3px;word-break:break-all}
.diagrow .st{font-family:"DM Mono",monospace;font-size:10px;white-space:nowrap;text-align:right}
.st.ok{color:#2f6b3a}.st.no{color:var(--signal)}.st.wait{color:#a3a39b}
@media(max-width:560px){
  .filter{margin-left:0;flex:0 0 100%;max-width:none;order:3;margin-top:6px}
  /* At the end of the bar this is an 11px field and reads as one. Full width,
     and at the 16px iOS insists on, uppercase letter-spaced type over a
     hairline stops being a field and becomes a heading — the only thing on the
     shelf that looks like a title and is not, sitting directly under two rows
     of real labels. So at this width it wears the control system's clothes
     instead: the same box, the same height as every other field, and sentence
     case, which is how the rest of the app says "type here". */
  .filter input{height:var(--ctl);border:1px solid var(--rule);padding:0 12px;
    text-transform:none;font-weight:500;-webkit-appearance:none;appearance:none;border-radius:0}
  .filter input:focus{border-color:var(--ink)}
  .filter input::placeholder{text-transform:none;letter-spacing:.02em}
  /* "Recommended" runs past its quarter of the tab row on a phone. Archivo is
     variable, so narrow the face instead of shrinking the type; the ellipsis
     on nav b is the backstop for when the webfont hasn't loaded yet. */
  nav button{padding:8px 6px 7px}
  nav b{font-size:9px;letter-spacing:.03em;font-variation-settings:"wdth" 62}
}

.flyer{position:fixed;z-index:60;pointer-events:none;transform-origin:left center;backface-visibility:hidden;
  background-size:cover;background-position:center}
.scrim{position:fixed;inset:0;background:rgba(17,17,16,.34);opacity:0;z-index:40;transition:opacity .3s;pointer-events:none}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;left:0;right:0;bottom:var(--kb,0px);z-index:50;background:var(--paper);
  border-top:1px solid var(--ink);
  transform:translateY(101%);transition:transform .46s cubic-bezier(.16,1,.3,1);overflow-y:auto;
  /* vh is the large viewport, so with the mobile URL bar showing it can put
     the panel's bottom under the chrome; dvh tracks it. --vvh is the visible
     window as the keyboard leaves it (see fitPanel); it falls back to dvh, and
     a browser with neither drops the calc line and keeps the vh one.
     overscroll-behavior stops a flick past the end of a long list from
     scrolling the page behind the scrim. */
  max-height:92vh;
  max-height:calc(var(--vvh,100dvh) * .92);
  overscroll-behavior:contain}
.panel.on{transform:translateY(0)}
.panelin{max-width:1180px;margin:0 auto;padding:0 var(--gut) calc(26px + env(safe-area-inset-bottom))}
/* Everything that stays put while the panel scrolls lives in one sticky
   block, so the pieces stack by document order. A second sticky at top:0
   would have to be told how tall .phead is — and that height moves when the
   webfont swaps. z-index:3 beats .shelfpick, so rows pass underneath. */
.pstick{position:sticky;top:0;z-index:3;background:var(--paper)}
.phead{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)}
/* The search panel parks its query field and result count here; every other
   panel leaves it empty, and an empty slot must not draw a rule of its own. */
.pslot{padding-bottom:10px;border-bottom:1px solid var(--rule)}
.pslot:empty{display:none}
.phead span{font-size:9px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:#6a6a63}
.x{appearance:none;background:none;border:0;font-family:inherit;font-size:11px;font-weight:700;
  letter-spacing:.16em;text-transform:uppercase;cursor:pointer;color:var(--ink)}

.detail{display:grid;grid-template-columns:1fr;gap:20px;padding-top:20px}
@media(min-width:720px){.detail{grid-template-columns:260px 1fr;gap:34px}}
.coverslot{width:100%;max-width:200px;aspect-ratio:2/3;
  background-size:contain;background-repeat:no-repeat;background-position:center}
.detail h2{font-size:clamp(21px,5.6vw,33px);font-weight:800;font-variation-settings:"wdth" 112;
  line-height:1.02;letter-spacing:-.035em;text-transform:uppercase}
.orig{font-size:11px;color:#a3a39b;margin-top:6px;font-style:italic}
.byline{font-size:12px;color:#6a6a63;margin-top:7px}
.blurb{margin-top:16px;font-size:13.5px;line-height:1.52;max-width:56ch;color:#2a2a26}
.meta{margin-top:18px;border-top:1px solid var(--rule)}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule)}
.row span:first-child{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#6a6a63;font-weight:600;padding-top:2px}
.statusline{margin-top:14px;font-size:11px;color:#6a6a63}
/* The buttons are a column of the panel, not a ragged block hung on its left
   edge. Every one of them grows to close its line, so the rows end where the
   meta rules and the section rules already end: a row of one reads as a bar,
   a row of two splits it down the middle. Capped, because a 10px label
   stretched across a desktop column is a hit area pretending to be a
   headline — past --ctl-col the air belongs back in the margin. The note and
   quote fields take the same measure, so the whole lower panel ends on one
   edge instead of three, and a note stays a readable line length. */
.acts,.keep,.notefield,.qlist,.qadd,.pagerow,.datefix{max-width:var(--ctl-col)}
.acts{margin-top:20px;display:flex;flex-wrap:wrap;gap:7px}
.acts.second{margin-top:9px}
.acts>*,.keep>*{flex:1 1 auto}
.act{border:1px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;
  transition:background .16s,color .16s}
.act:hover,.act:focus-visible{background:var(--ink);color:var(--paper)}
.act.on{background:var(--ink);color:var(--paper)}
.act.sig{border-color:var(--signal);color:var(--signal)}
.act.sig:hover{background:var(--signal);color:var(--paper)}
.act.quiet{border-color:var(--rule);color:#8b8b83;font-weight:600}
.act.quiet:hover{background:none;border-color:var(--ink);color:var(--ink)}
/* Deleting is quiet until you reach for it — a permanently loud delete is a
   delete you stop seeing. Has to sit after .act.quiet:hover: same specificity,
   so the later rule is the one that wins. */
.act.danger:hover,.act.danger:focus-visible{background:var(--signal);border-color:var(--signal);color:var(--paper)}
/* The one button that changes appearance without being pressed: the slider has
   reached the last page. Filled instead of outlined, so it reads as the next
   step — and the book still doesn't move until it is pressed. */
.act.sig.urge{background:var(--signal);color:var(--paper)}

/* A toggle wears the control system's metrics but not the border weight of an
   action: it isn't a thing you do. On and off have to differ in ink and not
   only in wording — a state you can only read by its wording is one you
   re-read every time — so the whole button fills when it is on. That is the
   same "this is set" the tab bar and .act.on already use, and unlike a tinted
   outline it survives a greyscale screenshot. */
.tog{border:1px solid var(--rule);background:transparent;color:#8b8b83;font-family:inherit;
  font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;
  transition:background .16s,border-color .16s,color .16s}
.tog:hover,.tog:focus-visible{border-color:var(--ink);color:var(--ink)}
.tog[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* Editing the record and deleting it are not reading actions: below the rule,
   after everything you actually opened the panel to do. */
.keep{margin-top:24px;padding-top:14px;border-top:1px solid var(--rule);display:flex;gap:7px;flex-wrap:wrap}

/* The strip the panel raises when the dates and the shelf disagree. Bordered in
   the accent because it is asking a question, tinted faintly because it is not
   an error. display:flex outranks the UA's [hidden] rule, so say it again. */
.confirm{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding:10px 12px;
  border:1px solid var(--signal);background:rgba(255,59,0,.05)}
.confirm[hidden]{display:none}
.confirm .ctext{flex:1;min-width:150px;font-size:12px;color:#2a2a26}
.pagerow{display:flex;align-items:center;gap:10px;margin-top:16px}
.pagerow input[type=range]{flex:1;accent-color:var(--signal)}
.datefix{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
/* Width lives on the label, not the input: the label is a column flex box, so
   its width is max(label text, field). Pinning it is what makes all three
   fields provably the same size rather than coincidentally similar. */
.datefix label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#6a6a63;font-weight:600;
  display:flex;flex-direction:column;gap:4px;width:var(--ctl-field)}
.datefix input{font-family:"DM Mono",monospace;font-size:11px;border:1px solid var(--rule);background:none;
  padding:0 8px;width:100%;color:var(--ink)}
/* WebKit ignores line-height on a date field and centres the value its own
   way; making the input a flex box is what actually centres it on iOS. */
.datefix input[type=date]{display:flex;align-items:center}
.datefix input[type=date]::-webkit-date-and-time-value{margin:0;line-height:1;text-align:left}
.datefix input[type=number]{-moz-appearance:textfield}
.datefix input[type=number]::-webkit-outer-spin-button,
.datefix input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.notes{margin-top:24px;border-top:1px solid var(--ink);padding-top:14px}
.sechead{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#6a6a63;font-weight:600}
.notefield{width:100%;margin-top:8px;border:1px solid var(--rule);background:none;color:var(--ink);
  font-family:inherit;font-size:13px;line-height:1.5;padding:9px 10px;min-height:86px;resize:vertical;
  -webkit-appearance:none;appearance:none;border-radius:0}
.notefield:focus,.qadd input:focus{outline:none;border-color:var(--ink)}
.qlist:not(:empty){margin-top:8px;border-top:1px solid var(--rule)}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:baseline;
  padding:9px 0;border-bottom:1px solid var(--rule)}
.q .qp{font-family:"DM Mono",monospace;font-size:10px;color:#a3a39b;white-space:nowrap}
.q .qt{font-size:13px;line-height:1.5;color:#2a2a26;white-space:pre-line}
.qx{appearance:none;background:none;border:0;font-family:inherit;font-size:11px;color:#a3a39b;
  cursor:pointer;padding:0 2px;line-height:1}
.qx:hover{color:var(--signal)}
/* A quote is prose, and prose typed into a 150px slot between a number and a
   button cannot be read back before it is filed. The passage takes the whole
   line and several of them; the page and the button go underneath, where they
   are the answer to "and now?" rather than two things in the way. */
.qadd{margin-top:10px}
.qfield{margin-top:0;min-height:72px}
.qrow{display:flex;gap:6px;margin-top:6px}
.qrow .act{flex:1 1 auto}
.qadd input{border:1px solid var(--rule);background:none;color:var(--ink);font-family:inherit;
  font-size:13px;padding:0 9px}
.qadd input[type=number]{flex:0 0 74px;width:74px;font-family:"DM Mono",monospace;font-size:11px;
  -moz-appearance:textfield}
.qadd input[type=number]::-webkit-outer-spin-button,
.qadd input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
/* A book you have written about carries a mark, so the shelf shows which */
.spine .noted{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);
  width:9px;height:1px;background:rgba(255,255,255,.8)}

.manualoffer{padding:16px 0 4px;display:flex;flex-direction:column;align-items:flex-start;gap:11px}
.manualform{padding-top:18px;display:flex;flex-direction:column;gap:11px;max-width:420px}
.manualform label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#6a6a63;
  font-weight:600;display:flex;flex-direction:column;gap:5px}
.manualform input{border:1px solid var(--rule);background:none;color:var(--ink);
  font-family:inherit;font-size:13px;padding:0 9px;width:100%}
.manualform input:focus{outline:none;border-color:var(--ink)}
.manualform input[type=number]{-moz-appearance:textfield}
.manualform input[type=number]::-webkit-outer-spin-button,
.manualform input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

.searchin{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ink);padding:16px 0 10px;margin-top:14px}
.searchin input{flex:1;border:0;background:none;font-family:inherit;font-size:clamp(19px,5vw,26px);font-weight:800;
  font-variation-settings:"wdth" 112;letter-spacing:-.03em;color:var(--ink);text-transform:uppercase}
.searchin input::placeholder{color:#b6b6ae}
.searchin input:focus{outline:none}
.hint{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#6a6a63;margin-top:9px;font-weight:600}
.opts{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.optline{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.res{display:flex;gap:13px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--rule);width:100%;
  background:none;border-left:0;border-right:0;border-top:0;text-align:left;font-family:inherit;cursor:pointer}
.res:hover{background:rgba(17,17,16,.035)}
.res .th{flex:0 0 34px;width:34px;height:51px;background:var(--grid);
  background-size:contain;background-repeat:no-repeat;background-position:center}
/* The shelf list is a search hit without the shelf buttons: same row, one extra
   column, which the register already knows how to set. Its own class rather
   than .res .info, which the search row also matches. */
.res .li{min-width:0;flex:1}
.res .dt{margin-left:auto;padding-left:10px}

/* Search hits carry three shelf buttons, so the row can't be one <button>.
   The title button stretches an invisible layer over the whole row for the
   default add; the shelf buttons sit above it and take their own taps. */
.res.pick{display:grid;grid-template-columns:34px 1fr;column-gap:13px;row-gap:9px;
  align-items:start;position:relative;cursor:default}
.res.pick .th{grid-row:1/span 2}
.reshit{grid-column:2;display:flex;align-items:flex-start;gap:8px;width:100%;background:none;border:0;
  padding:0;text-align:left;font-family:inherit;color:inherit;cursor:pointer}
.reshit .info{display:block;min-width:0}
.reshit .ti,.reshit .au{display:block}
.reshit::after{content:"";position:absolute;inset:0}
.reshit:focus-visible{outline:none}
.reshit:focus-visible::after{outline:2px solid var(--ink);outline-offset:-3px}
.shelfpick{grid-column:2;display:flex;gap:6px;flex-wrap:wrap;position:relative;z-index:1}
.res .ti{font-size:13.5px;font-weight:700;line-height:1.2}
.res .au{font-size:11px;color:#6a6a63;margin-top:3px}
.res .add{margin-left:auto;font-size:16px;color:#6a6a63;padding-left:8px}
#cam{width:100%;max-width:420px;margin-top:16px;background:#111;aspect-ratio:4/3;object-fit:cover}

/* The hidden offset has to be its own height plus the gap it sits above the
   floor — nothing less puts its top edge on the viewport's bottom. A bare
   percentage cannot do it: the translate scales with the box while the 22px
   does not, so the two never cancel and the old 140% left a black sliver
   standing at the foot of every screen, whatever the message said. */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));
  transform:translate(-50%,calc(100% + 22px + env(safe-area-inset-bottom)));z-index:80;background:var(--ink);
  color:var(--paper);padding:10px 14px;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  transition:transform .35s cubic-bezier(.16,1,.3,1);display:flex;align-items:center;gap:14px}
.toast.on{transform:translate(-50%,0)}
.toast button{appearance:none;background:none;border:0;color:var(--signal);font-family:inherit;font-size:10px;
  font-weight:700;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* iOS zoom guard — keep last in the sheet.
   Mobile Safari zooms the whole page whenever it focuses a control with a
   font-size under 16px, and it has ignored maximum-scale since iOS 10, so
   16px type is the only cure. The component rules above carry the same
   specificity, so these have to come after them to win. pointer:coarse
   catches every device with an on-screen keyboard, not just narrow ones. */
@media (pointer:coarse){
  /* 44px is Apple's minimum tap target; every control grows together */
  :root{--ctl:44px;--ctl-pad:15px}
  input,select,textarea{font-size:16px}
  .filter input{font-size:16px;letter-spacing:.04em}
  /* 16px type makes three fields too wide for one phone row, so drop the flex
     row for a two-column grid: the dates pair up, the year sits under them */
  .datefix{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
  .datefix label{width:auto;min-width:0}
  .datefix input{font-size:16px;min-width:0}
  /* Any `.class input` rule outranks the bare selector above, so every text
     control that sets its own size has to be named here or it re-enables zoom.
     The quote page field needs its type in the selector too: .qadd
     input[type=number] sets 11px and outranks a bare `.qadd input`, so until
     this matched it, tapping it zoomed the page. */
  .notefield,.qadd input,.qadd input[type=number],.manualform input{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark">Book<br>shelf</div>
    <div class="adds">
      <button class="btn fill" id="openScan">Scan</button>
      <button class="btn" id="openSearch">Search</button>
    </div>
  </header>

  <nav id="tabs" role="tablist">
    <button role="tab" data-view="reading" aria-selected="true"><b>Reading</b><span class="n" data-count="reading">00</span></button>
    <button role="tab" data-view="toread" aria-selected="false"><b>To read</b><span class="n" data-count="toread">00</span></button>
    <button role="tab" data-view="rec" aria-selected="false"><b>Recommended</b><span class="n" data-count="rec">00</span></button>
    <button role="tab" data-view="read" aria-selected="false"><b>Read</b><span class="n" data-count="read">00</span></button>
  </nav>
  <div class="railwrap"><div class="rail" id="rail"></div></div>

  <div class="bar">
    <div class="segbox"><span class="lab" id="barlab">Order</span><div class="seg" id="seg"></div></div>
    <div class="segbox" id="viewbox" hidden><span class="lab">View</span><div class="seg" id="seg2"></div></div>
    <div class="filter"><input id="filter" placeholder="Find on the shelf" aria-label="Filter the shelf"></div>
  </div>

  <div id="view"></div>

  <div class="foot">
    <button id="nettest">Network test</button>
    <button id="export">Export JSON</button>
    <button id="import">Import CSV / JSON</button>
    <button id="findcovers" hidden>Find missing covers</button>
    <button id="wipe">Empty the shelf</button>
    <span id="storenote" class="storenote"></span>
    <input type="file" id="importfile" accept="application/json,.json,text/csv,.csv" hidden>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<div class="panel" id="panel">
  <div class="panelin">
    <div class="pstick">
      <div class="phead"><span id="ptitle">Book</span><button class="x" id="closePanel">Close ✕</button></div>
      <div class="pslot" id="pslot"></div>
    </div>
    <div id="pbody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════ constants ═══════════ */
const VIEWS = {reading:"Reading", toread:"To read", rec:"Recommended", read:"Read"};
const LANGS = {nor:"Norwegian", nob:"Norwegian", nno:"Nynorsk", eng:"English", swe:"Swedish", dan:"Danish",
               ger:"German", fre:"French", spa:"Spanish", ita:"Italian"};
const KEY="bokhylle:books", SKEY="bokhylle:settings";
let books=[], view="reading", sort="added", sortDir=1, regFilter="all", regMode="shelf";
/* How the three unfinished shelves are drawn. One value for all of them, not one
   per tab: this is a display preference like regMode, not a property of a shelf,
   and a per-view map would buy a lookup and a default in exchange for nothing. */
let listMode="shelf";
let prefLang="nor", source="ol", filterText="", flyer=null, lastRemoved=null, camStream=null;
let animateShelf=true; // entrance animation only on first paint and view switches
let lastQuery="", justAdded=null, lastEntry=""; // for the follow-on link after an add

const $ = s => document.querySelector(s);
const el = (t,c) => { const e=document.createElement(t); if(c) e.className=c; return e; };
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ═══════════ color ═══════════ */
function hashN(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0; return h; }
const fallbackColor = s => { const h=hashN(s); return `hsl(${h%360} ${28+(h>>8)%26}% ${30+(h>>4)%22}%)`; };
function readable(c){
  const m=(c||"").match(/\d+/g); if(!m||m.length<3) return "#EFEFEA";
  const [r,g,b]=m.map(Number);
  return (r*299+g*587+b*114)/1000 > 132 ? "#111110" : "#EFEFEA";
}
function extractColor(url){
  return new Promise(res => {
    if(!url) return res(null);
    const img=new Image(); img.crossOrigin="anonymous";
    img.onload=()=>{ try{
      const n=24, cv=el("canvas"); cv.width=n; cv.height=n;
      const cx=cv.getContext("2d",{willReadFrequently:true}); cx.drawImage(img,0,0,n,n);
      const d=cx.getImageData(0,0,n,n).data, bins={};
      for(let i=0;i<d.length;i+=4){
        const r=d[i],g=d[i+1],b=d[i+2], k=`${r>>5},${g>>5},${b>>5}`;
        (bins[k]=bins[k]||{n:0,r:0,g:0,b:0}); bins[k].n++; bins[k].r+=r; bins[k].g+=g; bins[k].b+=b;
      }
      let bs=-1,br=0,bg=0,bb=0;
      for(const k in bins){
        const o=bins[k], r=o.r/o.n, g=o.g/o.n, b=o.b/o.n;
        const mx=Math.max(r,g,b), mn=Math.min(r,g,b);
        const sat=mx===0?0:(mx-mn)/mx, light=mx/255;
        const score=o.n*(0.35+sat*1.5)*((light>0.94||light<0.08)?0.12:1);
        if(score>bs){bs=score;br=r;bg=g;bb=b;}
      }
      res(`rgb(${Math.round(br*.86)}, ${Math.round(bg*.86)}, ${Math.round(bb*.86)})`);
    }catch(e){ res(null); } };
    img.onerror=()=>res(null);
    img.src=url;
  });
}

/* ═══════════ SOURCE ADAPTERS ═══════════
   All sources answer in the same shape, so the rest of the app
   never knows who delivered the data. Swap the internals here if
   NB or Bokbasen turns out to be better for Norwegian editions.
   { title, author, year, pages, isbn, lang, coverUrl, blurb, ref, source }
═══════════════════════════════════════ */
const isIsbn = q => /^[\d\-\s]{10,17}$/.test(q.trim()) && q.replace(/\D/g,"").length>=10;
const olCover = (id,s) => id ? `https://covers.openlibrary.org/b/id/${id}-${s}.jpg` : null;

const SOURCES = {
  ol: {
    label:"Open Library", canEditions:true,
    async search(q){
      const query = isIsbn(q) ? `isbn:${q.replace(/\D/g,"")}` : q;
      const url = "https://openlibrary.org/search.json?limit=14&fields=key,title,author_name,"
        + "first_publish_year,cover_i,number_of_pages_median,isbn,language&q=" + encodeURIComponent(query);
      const j = await (await fetch(url)).json();
      return (j.docs||[]).map(d => ({
        title:d.title, author:(d.author_name||["Unknown"])[0], year:d.first_publish_year||null,
        pages:d.number_of_pages_median||260, isbn:(d.isbn||[])[0]||null,
        lang:(d.language||[])[0]||null, coverUrl:olCover(d.cover_i,"M"),
        coverBig:olCover(d.cover_i,"L"), blurb:null, ref:d.key, source:"ol"
      }));
    },
    async editions(ref){
      const j = await (await fetch(`https://openlibrary.org${ref}/editions.json?limit=120`)).json();
      return (j.entries||[]).filter(e=>e.title).map(e => ({
        title:e.title + (e.subtitle ? ": "+e.subtitle : ""),
        langs:(e.languages||[]).map(l=>l.key.split("/").pop()),
        coverUrl:olCover((e.covers||[]).filter(c=>c>0)[0],"M"),
        coverBig:olCover((e.covers||[]).filter(c=>c>0)[0],"L"),
        isbn:(e.isbn_13||e.isbn_10||[])[0]||null,
        year:((e.publish_date||"").match(/\d{4}/)||[null])[0],
        publisher:(e.publishers||[])[0]||null, pages:e.number_of_pages||null
      }));
    },
    async blurb(ref){
      const j = await (await fetch(`https://openlibrary.org${ref}.json`)).json();
      let d=j.description; if(d&&typeof d==="object") d=d.value;
      return d ? String(d).split("([")[0].replace(/\[\d+\]/g,"").trim().slice(0,620) : null;
    }
  },
  gb: {
    label:"Google Books", canEditions:false,
    async search(q){
      const query = isIsbn(q) ? `isbn:${q.replace(/\D/g,"")}` : q;
      const lang = prefLang==="any" ? "" : `&langRestrict=${prefLang==="nor"?"no":"en"}`;
      const url = `https://www.googleapis.com/books/v1/volumes?maxResults=14&q=${encodeURIComponent(query)}${lang}`;
      const j = await (await fetch(url)).json();
      return (j.items||[]).map(it => {
        const v = it.volumeInfo||{};
        const img = (v.imageLinks||{});
        const fix = u => u ? u.replace(/^http:/,"https:") : null;
        const ids = v.industryIdentifiers||[];
        return {
          title:v.title + (v.subtitle ? ": "+v.subtitle : ""),
          author:(v.authors||["Unknown"])[0], year:(v.publishedDate||"").slice(0,4)||null,
          pages:v.pageCount||260,
          isbn:(ids.find(i=>i.type==="ISBN_13")||ids[0]||{}).identifier||null,
          lang:{no:"nor",en:"eng",sv:"swe",da:"dan",de:"ger",fr:"fre"}[v.language]||v.language||null,
          coverUrl:fix(img.thumbnail||img.smallThumbnail),
          coverBig:fix((img.thumbnail||"").replace("zoom=1","zoom=3")) || fix(img.thumbnail),
          publisher:v.publisher||null,
          blurb:v.description ? v.description.replace(/<[^>]+>/g,"").slice(0,620) : null,
          ref:it.id, source:"gb"
        };
      });
    },
    async blurb(){ return null; }
  }
};

/* ═══════════ storage ═══════════
   IndexedDB on our own host, window.storage inside Claude,
   memory as the last resort. Same API either way.        */
const MEM={};
const HAS_CLAUDE = typeof window!=="undefined" && !!window.storage;

const IDB = (()=>{
  let dbp=null;
  const open=()=>dbp||(dbp=new Promise((res,rej)=>{
    const r=indexedDB.open("bokhylle",1);
    r.onupgradeneeded=()=>{ const db=r.result;
      if(!db.objectStoreNames.contains("kv")) db.createObjectStore("kv"); };
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  }));
  const tx=async(mode,fn)=>{
    const db=await open();
    return new Promise((res,rej)=>{
      const t=db.transaction("kv",mode), st=t.objectStore("kv");
      const rq=fn(st);
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    });
  };
  return {
    available: typeof indexedDB!=="undefined",
    get: async k => { const v=await tx("readonly",st=>st.get(k)); return v==null?null:{key:k,value:v}; },
    set: async (k,v) => { await tx("readwrite",st=>st.put(v,k)); return {key:k,value:v}; }
  };
})();

const MEMSTORE = {
  get: async k => (k in MEM ? {key:k, value:MEM[k]} : null),
  set: async (k,v) => { MEM[k]=v; return {key:k, value:v}; }
};
const STORE = HAS_CLAUDE ? window.storage : (IDB.available ? IDB : MEMSTORE);
const STORE_KIND = HAS_CLAUDE ? "claude" : (IDB.available ? "idb" : "mem");

async function save(){
  try{ await STORE.set(KEY, JSON.stringify(books)); }
  catch(e){ console.warn("saving failed", e); toast("Saving failed — export JSON"); }
}
async function saveSettings(){ try{ await STORE.set(SKEY, JSON.stringify({prefLang,source,listMode,sort,sortDir})); }catch(e){} }
async function load(){
  try{ const s=await STORE.get(SKEY); if(s&&s.value){ const o=JSON.parse(s.value);
    prefLang=o.prefLang||prefLang; source=o.source||source;
    /* Validated, not trusted: a settings blob written before these keys existed
       has none of them, and a sort key with no comparator would fall through to
       Array.sort's default string order — wrong, and silent about it. SORTS is
       declared further down; load() only ever runs from the start-up block at
       the foot of the file, so it is defined by then. */
    listMode = o.listMode==="list" ? "list" : "shelf";
    if(SORTS[o.sort]) sort=o.sort;
    sortDir = o.sortDir===-1 ? -1 : 1; } }catch(e){}
  try{ const r=await STORE.get(KEY); if(r&&r.value){ books=JSON.parse(r.value); return true; } }catch(e){}
  return false;
}
const finYear = b => (b.finished||"").slice(0,4) || b.finishedYear || null;
const finKey  = b => b.finished || (b.finishedYear ? b.finishedYear+"-00-00" : "0000-00-00");
const isDone  = b => b.shelf==="read" && !b.gaveUp;

const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
/* Dates are stored and listed as ISO, because a register wants a column of
   identical shapes. In a sentence it has to read like speech instead. Parsed by
   hand rather than through Date: `new Date("2026-09-01")` is UTC midnight, which
   renders as 31 Aug for anyone west of Greenwich. Returns "" for anything that
   isn't a date, so callers test the result and never the input. */
const fmtDay = s => {
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||""); if(!m) return "";
  const y = m[1]===String(new Date().getFullYear()) ? "" : " "+m[1];
  return `${+m[3]} ${MONTHS[+m[2]-1]}${y}`;
};

/* ═══════════ selection ═══════════ */
function matches(b){
  if(!filterText) return true;
  const q = filterText.toLowerCase();
  return (b.title+" "+b.author+" "+(b.origTitle||"")).toLowerCase().includes(q);
}
/* A shelf sorted by title puts every "The" in one place, which is not an order
   anyone is looking for. English and Norwegian articles only — that is what this
   shelf holds. */
const sortTitle = t => String(t||"").toLowerCase().replace(/^(the|a|an|en|et|ei|den|det|de)\s+/,"");
/* Ascending only. sortDir flips the result, so each order has one definition
   rather than two that can drift apart. Missing values sort as empty or zero and
   land first ascending; with five keys a null-placement rule costs more than the
   tidiness is worth. */
const SORTS = {
  added:  (a,b)=>(a.addedAt||"").localeCompare(b.addedAt||""),
  author: (a,b)=>(a.author||"").localeCompare(b.author||"","en"),
  title:  (a,b)=>sortTitle(a.title).localeCompare(sortTitle(b.title),"en"),
  /* Open Library hands back a number and Google Books a string; + settles it. */
  year:   (a,b)=>((+a.year)||0)-((+b.year)||0),
  pages:  (a,b)=>(a.pages||0)-(b.pages||0)
};
const SORT_OPTS=[["added","Added"],["author","Author"],["title","Title"],["year","Year"],["pages","Pages"]];

function listFor(v){
  let l = v==="rec" ? books.filter(b=>b.rec) : books.filter(b=>b.shelf===v);
  l = l.filter(matches);
  if(v==="read"){
    if(regFilter==="done") l = l.filter(isDone);
    if(regFilter==="gave") l = l.filter(b=>b.gaveUp);
    return l.slice().sort((a,b)=>finKey(b).localeCompare(finKey(a)));
  }
  const by = SORTS[sort] || SORTS.added;   // a stale settings key must not mean "string sort"
  return l.slice().sort((a,b)=>{
    /* Up next first in both directions: it is a statement about the shelf, not
       about the order, so flipping the order must not bury it. The !! is because
       upNext is absent on every record stored before it existed. */
    const p = (!!b.upNext) - (!!a.upNext);
    return p || by(a,b)*sortDir;
  });
}

/* ═══════════ rendering ═══════════ */
const spineWidth = p => Math.round(Math.max(15, Math.min(58, 15 + Math.sqrt(p||220)*1.75)));
const spineHeight = b => Math.round(186 + (hashN(b.title)%56));

function render(){
  for(const k in VIEWS){
    const n = k==="rec" ? books.filter(b=>b.rec).length : books.filter(b=>b.shelf===k).length;
    $(`[data-count="${k}"]`).textContent = String(n).padStart(2,"0");
  }
  /* Counted from the data on every paint, so pressing it twice picks up where
     the last run stopped and it disappears of its own accord when the shelf is
     complete. An offer to find nothing is worse than no offer. */
  const nocov=coverless().length, fc=$("#findcovers");
  fc.hidden=!nocov;
  if(nocov) fc.textContent=`Find ${nocov} missing cover${nocov===1?"":"s"}`;
  buildBar();
  const host=$("#view"); host.innerHTML="";
  const list = listFor(view);

  if(!list.length){
    host.appendChild(buildEmpty());
  } else if(view==="read"){
    host.appendChild(buildStats());
    host.appendChild(regMode==="shelf" ? buildYearShelves(list) : buildRegister(list));
  } else {
    if(view==="toread" && list.length>=3) host.appendChild(buildPicker());
    if(listMode==="list") host.appendChild(buildList(list));
    else {
      const st=el("div","stack");
      buildShelf(list).forEach(n=>st.appendChild(n));
      host.appendChild(st);
    }
  }
  moveRail();
  animateShelf=false;
}

function buildEmpty(){
  const first = books.length===0;
  const e=el("div","empty");
  if(first){
    e.classList.add("first");
    e.innerHTML = `<b>The shelf is empty</b>
      <p>If you have the book in front of you, scan the barcode on the back.
      Otherwise search by title — pick the edition in the language you read it in.</p>`;
    const row=el("div","acts"); row.style.marginTop="18px";
    const s1=el("button","act sig"); s1.textContent="Scan barcode";
    s1.onclick=()=>$("#openScan").click();
    const s2=el("button","act"); s2.textContent="Search by title";
    s2.onclick=()=>$("#openSearch").click();
    const s3=el("button","act quiet"); s3.textContent="Import CSV / JSON";
    s3.onclick=()=>$("#import").click();
    row.append(s1,s2,s3); e.appendChild(row);
  } else if(filterText){
    e.innerHTML = `<b>No matches</b><p>No books on this shelf match “${esc(filterText)}”.</p>`;
  } else {
    e.innerHTML = view==="read"
      ? `<b>Nothing logged yet</b><p>Books end up here when you mark them as read or given up.</p>`
      : view==="rec"
      ? `<b>No recommendations</b><p>Press “Recommend” on a book you want to remember to tip others about.</p>`
      : view==="reading"
      ? `<b>Not reading anything right now</b><p>Open a book from To read and press “Start reading”.</p>`
      : `<b>Empty shelf</b><p>Scan the barcode on a book in front of you, or search by title.</p>`;
  }
  return e;
}

/* Looks like mk() in the search panel and deliberately isn't it: mk binds a
   handler per button for a segment that lives as long as its panel, while the
   bar's segments are thrown away and rebuilt on every render — including on
   every keystroke in the filter field — and are served by one delegated
   listener on a stable host. Sharing one factory would mean re-binding
   handlers on every keystroke. */
function fillSeg(host,opts,cur,dir){
  host.innerHTML="";
  opts.forEach(([k,t])=>{
    const b=el("button"); b.dataset.k=k;
    const on = k===cur;
    b.setAttribute("aria-pressed",String(on));
    /* The arrow rides inside the label rather than in a pseudo-element, so it
       sits above the underline aria-pressed already draws. */
    b.textContent = (on&&dir) ? `${t} ${dir<0?"↓":"↑"}` : t;
    if(on&&dir) b.setAttribute("aria-label",`${t}, ${dir<0?"descending":"ascending"}`);
    host.appendChild(b);
  });
}
function buildBar(){
  const isRead = view==="read";
  $("#barlab").textContent = isRead ? "Show" : "Order";
  fillSeg($("#seg"),
    isRead ? [["shelf","Shelf"],["list","List"],["gave","Gave up"]] : SORT_OPTS,
    isRead ? (regFilter==="gave" ? "gave" : regMode) : sort,
    isRead ? 0 : sortDir);
  /* The second segment exists only where there are two ways to draw the list.
     The Read tab already spends its first segment on exactly that choice. */
  fillSeg($("#seg2"), [["shelf","Shelf"],["list","List"]], listMode, 0);
  $("#viewbox").hidden = isRead;
}

function packRows(list){
  const avail = Math.max(240, $("#view").clientWidth || innerWidth-40);
  const gap=3, rows=[[]]; let w=0;
  list.forEach(b=>{
    const bw=spineWidth(b.pages);
    if(w+bw+gap > avail-10 && rows[rows.length-1].length){ rows.push([]); w=0; }
    rows[rows.length-1].push(b); w+=bw+gap;
  });
  return rows;
}

function buildShelf(list, label){
  const rows = packRows(list);
  let n=0;
  return rows.map((row,ri)=>{
    const wrap=el("div","rowwrap"), rb=el("div","rowbooks");
    let tall=0, used=0;
    row.forEach(b=>{ tall=Math.max(tall,spineHeight(b)); used+=spineWidth(b.pages)+3; rb.appendChild(makeSpine(b,n++)); });
    const avail = Math.max(240, $("#view").clientWidth || innerWidth-40);
    if(avail-used > 40){                       // bookend where the shelf isn't full
      const be=el("div","bookend"); be.style.height=(tall*0.55)+"px"; rb.appendChild(be);
    }
    const line=el("div","rowline");
    if(ri===0 && label!==false){ const l=el("div","shelflabel"); l.textContent=VIEWS[view]; line.appendChild(l); }
    if(rows.length>1){
      const m=el("div","rowmeta");
      m.textContent=`${String(ri+1).padStart(2,"0")} / ${String(rows.length).padStart(2,"0")}`;
      line.appendChild(m);
    }
    wrap.append(rb,line);
    return wrap;
  });
}

function makeSpine(b,i){
  const w=spineWidth(b.pages), h=spineHeight(b);
  const btn=el("button","spine"+(b.gaveUp?" gave":""));
  btn.style.width=w+"px"; btn.style.height=h+"px";
  if(w<24) btn.dataset.narrow="1";
  btn.setAttribute("aria-label", `${b.title} by ${b.author}`);
  const body=el("div","body"); body.style.background=b.color;
  const t=el("div","t"); t.textContent=b.title; t.style.color=readable(b.color);
  body.appendChild(t);
  if(b.rec && view!=="rec") body.appendChild(el("div","star"));
  if(hasNotes(b)) body.appendChild(el("div","noted"));
  if(b.upNext && b.shelf==="toread") body.appendChild(el("div","pin"));
  if(b.shelf==="reading" && b.page>0){
    const p=el("div","prog"); p.style.width=Math.min(100,(b.page/(b.pages||1))*100)+"%"; body.appendChild(p);
  }
  btn.appendChild(body);
  btn.onclick=()=>openBook(b,body);
  if(animateShelf)
    btn.animate([{transform:"translateY(26px) scaleY(.9)",opacity:0},{transform:"none",opacity:1}],
      {duration:480, delay:Math.min(i,24)*30, easing:"cubic-bezier(.16,1,.3,1)", fill:"backwards"});
  return btn;
}

/* the reading year as a physical shelf */
function buildYearShelves(list){
  const box=el("div");
  const years={};
  list.forEach(b=>{ const y=finYear(b)||"Undated"; (years[y]=years[y]||[]).push(b); });
  Object.keys(years).sort((a,c)=>{
    if(a==="Undated") return 1; if(c==="Undated") return -1; return c.localeCompare(a);
  }).forEach(y=>{
    const head=el("div","yearhead");
    const pages=years[y].reduce((s,b)=>s+(b.gaveUp?(b.page||0):(b.pages||0)),0);
    head.innerHTML=`<div class="y">${esc(y)}</div><div class="c">${years[y].length} books · ${pages.toLocaleString("en-US")} pages</div>`;
    box.appendChild(head);
    const st=el("div","stack");
    buildShelf(years[y], false).forEach(n=>st.appendChild(n));
    box.appendChild(st);
  });
  return box;
}

function buildRegister(list){
  const box=el("div");
  let group=null, reg=null, i=list.length;
  list.forEach(b=>{
    const y=finYear(b)||"Undated";
    if(y!==group){
      group=y;
      const h=el("div","yearhead"); h.innerHTML=`<div class="y">${esc(y)}</div>`; box.appendChild(h);
      reg=el("div","reg"); box.appendChild(reg);
    }
    const days=(b.started&&b.finished)?Math.max(1,Math.round((new Date(b.finished)-new Date(b.started))/864e5)):null;
    const when=b.finished||(b.finishedYear?"≈ "+b.finishedYear:"undated");
    const extent=b.gaveUp?`p. ${b.page||0} of ${b.pages||"?"}`:`${b.pages||"—"} pp.${days?` · ${days} d`:""}`;
    const r=el("button","regrow"+(b.gaveUp?" gave":""));
    r.innerHTML=`<div class="idx">${String(i--).padStart(2,"0")}</div>
      <div><div class="ti">${esc(b.title)}${b.rec?" ●":""}</div>
        <div class="au">${esc(b.author)}${b.gaveUp?' <span class="tagx">Gave up</span>':""}${hasNotes(b)?' <span class="tagx">Notes</span>':""}</div></div>
      <div class="dt">${esc(when)}<br>${extent}</div>`;
    r.onclick=()=>openBook(b,r);
    reg.appendChild(r);
  });
  return box;
}

/* The unfinished shelves as a catalogue rather than as furniture. A spine tells
   you thickness and nothing else, and a title under 24px wide isn't drawn at
   all — but choosing what to read next is done on the cover, the author and the
   page count. Built on .res, the same row the search results and the editions
   list already use, so the thumbnail has one definition in the sheet. */
function buildList(list){
  const wrap=el("div","stack"), box=el("div","reg");
  list.forEach(b=>{
    const r=el("button","res");
    const th=el("div","th"); th.setAttribute("aria-hidden","true");
    th.style.backgroundColor=b.color;          // a coverless book keeps its spine colour
    const u=b.coverUrl||b.coverBig;
    if(u) th.style.backgroundImage=`url(${u})`;
    const info=el("div","li");
    info.innerHTML=`<div class="ti">${esc(b.title)}${b.rec?" ●":""}</div>`+
      `<div class="au">${esc(b.author)}`+
      (b.upNext&&b.shelf==="toread"?' <span class="tagx now">Up next</span>':"")+
      (hasNotes(b)?' <span class="tagx">Notes</span>':"")+`</div>`;
    const added=fmtDay(b.addedAt);
    const dt=el("div","dt");
    dt.innerHTML=`${b.pages?b.pages+" pp.":"—"}<br>${added?"added "+esc(added):""}`;
    r.append(th,info,dt);
    r.setAttribute("aria-label",`${b.title} by ${b.author}`);
    /* The thumb is the flight source: unfold bails above 120px, so a 34px cover
       opens into the panel the same way a spine does. */
    r.onclick=()=>openBook(b,th);
    box.appendChild(r);
  });
  wrap.appendChild(box);
  return wrap;
}

/* A pile you can't choose from is a pile you don't read. Draws from the list as
   filtered — a filter is the reader narrowing the question, and answering a
   wider one would be a trick — and re-reads it at click time, because the shelf
   can change under an open tab. Pins are ignored: pinning is about order,
   picking is about chance. */
function buildPicker(){
  const row=el("div","pickrow");
  const btn=el("button","act quiet"); btn.textContent="Pick one for me";
  btn.onclick=()=>{
    const pool=listFor("toread");
    if(!pool.length) return;
    openBook(pool[Math.floor(Math.random()*pool.length)], null);
  };
  row.appendChild(btn);
  return row;
}

function buildStats(){
  const yr=new Date().getFullYear();
  const done=books.filter(b=>isDone(b)&&String(finYear(b))===String(yr)).length;
  const pages=books.filter(b=>b.shelf==="read").reduce((s,b)=>s+(b.gaveUp?(b.page||0):(b.pages||0)),0);
  const fin=books.filter(b=>isDone(b)&&b.started&&b.finished);
  const avg=fin.length?Math.round(fin.reduce((s,b)=>s+(new Date(b.finished)-new Date(b.started))/864e5,0)/fin.length):0;
  const d=el("div","stats");
  d.innerHTML=`<div class="stat"><div class="v">${String(done).padStart(2,"0")}</div><div class="k">Finished in ${yr}</div></div>
    <div class="stat"><div class="v">${pages.toLocaleString("en-US")}</div><div class="k">Total pages</div></div>
    <div class="stat"><div class="v">${String(avg).padStart(2,"0")}</div><div class="k">Avg. days per book</div></div>`;
  return d;
}

function moveRail(){
  const b=document.querySelector(`#tabs [data-view="${view}"]`);
  const nav=$("#tabs").getBoundingClientRect(), r=b.getBoundingClientRect();
  $("#rail").style.left=(r.left-nav.left)+"px"; $("#rail").style.width=r.width+"px";
}

/* ═══════════ events ═══════════ */
$("#tabs").onclick=e=>{
  const b=e.target.closest("[data-view]"); if(!b) return;
  view=b.dataset.view;
  document.querySelectorAll("#tabs [role=tab]").forEach(t=>t.setAttribute("aria-selected",String(t.dataset.view===view)));
  animateShelf=true;
  render();
};
$("#seg").onclick=e=>{
  const b=e.target.closest("[data-k]"); if(!b) return;
  const k=b.dataset.k;
  if(view==="read"){
    if(k==="gave"){ regFilter = regFilter==="gave" ? "all" : "gave"; }
    else { regMode=k; regFilter="all"; }
  } else {
    /* Pressing the order you are already on flips it. That is the whole reason
       "newest first" is reachable without spending a second control on it. */
    if(k===sort) sortDir=-sortDir; else { sort=k; sortDir=1; }
    saveSettings();
  }
  animateShelf=true;
  render();
};
$("#seg2").onclick=e=>{
  const b=e.target.closest("[data-k]"); if(!b) return;
  listMode=b.dataset.k; saveSettings();
  animateShelf=true;
  render();
};
$("#filter").oninput=e=>{ filterText=e.target.value.trim(); render(); };
/* Re-render on resize only when the width actually changes — on mobile the
   URL bar showing/hiding fires resize with a height change on every scroll. */
let rt, lastW=innerWidth;
addEventListener("resize",()=>{
  if(innerWidth===lastW) return;
  lastW=innerWidth;
  clearTimeout(rt); rt=setTimeout(render,160);
});

/* ═══════════ panel ═══════════ */
/* `head` goes in the sticky region above the scroll, for panels that have
   something worth pinning there. Everything else leaves it empty. */
function openPanel(title,node,head){
  const p=$("#panel");
  $("#ptitle").textContent=title;
  $("#pslot").innerHTML=""; if(head) $("#pslot").appendChild(head);
  $("#pbody").innerHTML=""; $("#pbody").appendChild(node);
  p.classList.add("on"); $("#scrim").classList.add("on");
  /* New content, new panel: start at the top. Nothing did this before, which
     is why opening Search after reading a long book landed you mid-list.
     Same synchronous block as the append, so there is no paint in between —
     and not in closePanel, where the sheet is still visibly sliding away. */
  p.scrollTop=0;
}
/* The keyboard does not shrink the layout viewport on iOS — it just covers
   the bottom of it. A sheet pinned to that bottom therefore runs on behind the
   keys, and since it is also taller than what is left, its top goes off the
   screen: the query field, sticky to a panel top that is no longer on screen,
   goes with it, and you type blind into a list of results. visualViewport is
   the only thing that knows where the visible window actually is, so the panel
   is measured and pinned against that instead of against the window.
   offsetTop is in the sum because Safari scrolls the visual viewport as well
   as resizing it, and a panel that ignored that would sit one keyboard too
   low. No listener at all on a browser without the API: bottom and height then
   fall back to the plain viewport, which is what they were before. */
function fitPanel(){
  const vv=visualViewport, r=document.documentElement;
  r.style.setProperty("--kb", Math.max(0, innerHeight-(vv.offsetTop+vv.height))+"px");
  r.style.setProperty("--vvh", vv.height+"px");
}
if(window.visualViewport){
  visualViewport.addEventListener("resize",fitPanel);
  visualViewport.addEventListener("scroll",fitPanel);
  fitPanel();
}

function closePanel(){
  $("#panel").classList.remove("on"); $("#scrim").classList.remove("on");
  if(flyer){ flyer.remove(); flyer=null; }
  stopCam();
}
$("#closePanel").onclick=closePanel; $("#scrim").onclick=closePanel;
addEventListener("keydown",e=>{ if(e.key==="Escape") closePanel(); });

function toast(msg, undo){
  const t=$("#toast"); t.innerHTML="";
  t.appendChild(document.createTextNode(msg));
  if(undo){ const u=el("button"); u.textContent="Undo"; u.onclick=()=>{ undo(); t.classList.remove("on"); }; t.appendChild(u); }
  t.classList.add("on");
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"), undo?5200:1700);
}

function unfold(src,b,done){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches||!src){ done(); return; }
  const r=src.getBoundingClientRect();
  if(r.width>120){ done(); return; }
  const f=el("div","flyer");
  f.style.cssText+=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px;background-color:${b.color}`;
  if(b.coverBig||b.coverUrl) f.style.backgroundImage=`url(${b.coverBig||b.coverUrl})`;
  document.body.appendChild(f); flyer=f;
  const tw=Math.min(200,innerWidth*0.44), th=tw*1.5;
  const tx=innerWidth>720?20:(innerWidth-tw)/2-r.left, ty=innerHeight*0.30-r.top;
  const a=f.animate([
    {transform:"perspective(1400px) rotateY(0deg) translate(0,0)",width:r.width+"px",height:r.height+"px"},
    {transform:`perspective(1400px) rotateY(-52deg) translate(${tx*.5}px,${ty*.55}px)`,width:(r.width+tw)/2+"px",height:(r.height+th)/2+"px",offset:.5},
    {transform:`perspective(1400px) rotateY(0deg) translate(${tx}px,${ty}px)`,width:tw+"px",height:th+"px"}
  ],{duration:640,easing:"cubic-bezier(.22,1,.28,1)",fill:"forwards"});
  setTimeout(done,230);
  a.onfinish=()=>{ f.animate([{opacity:1},{opacity:0}],{duration:220,fill:"forwards",delay:120})
    .onfinish=()=>{ f.remove(); if(flyer===f) flyer=null; }; };
}

/* ═══════════ book detail ═══════════ */
/* Covers arrive in every shape — square reprints, tall paperbacks. Letting the
   slot take the file's own ratio shows the whole jacket instead of trimming
   the title off it. Falls back to the 2/3 in the stylesheet if the load fails. */
function fitRatio(node,url){
  const im=new Image();
  im.onload=()=>{ if(im.naturalWidth && im.naturalHeight)
    node.style.aspectRatio=`${im.naturalWidth}/${im.naturalHeight}`; };
  im.src=url;
}

async function openBook(b,src){
  if(src) justAdded=null;              // opened from the shelf, not from a search
  unfold(src,b,()=>openPanel(b.gaveUp?"Gave up":VIEWS[b.shelf],buildDetail(b)));
  if(!b.blurb && b.ref && b.src && SOURCES[b.src].blurb){
    try{
      const t=await SOURCES[b.src].blurb(b.ref);
      if(t){ b.blurb=t; save();
        const s=$("#pbody").querySelector(`[data-blurb="${b.id}"]`); if(s) s.textContent=t; }
      else { const s=$("#pbody").querySelector(`[data-blurb="${b.id}"]`); if(s) s.textContent="No description on record."; }
    }catch(e){}
  }
}
/* The one panel that must not jump to the top: it rebuilds the same book
   under the reader after a shelf action. But it is also reached from an
   editions row, where the panel is a long list of editions — keeping that
   offset would drop you into the middle of the detail. So check what is
   actually on screen first. Read the offset before openPanel empties the
   body, or it measures nothing and returns 0. */
function refresh(b){
  const p=$("#panel");
  const same=!!$("#pbody").querySelector(`[data-cover="${b.id}"]`);
  const y=same?p.scrollTop:0;
  save(); render();
  openPanel(b.gaveUp?"Gave up":VIEWS[b.shelf], buildDetail(b));
  p.scrollTop=y;
}

/* Update an open detail panel in place. refresh() would do it by rebuilding,
   but that discards a half-typed date and the focus that goes with it — and
   the whole point of opening the panel on add is that you type dates in it.
   Only the fields an edition swap actually touches are patched; .datefix is
   deliberately left alone. A no-op if the panel closed or moved on. */
function patchDetail(b){
  const scope=$("#pbody");
  const cov=scope.querySelector(`[data-cover="${b.id}"]`);
  if(!cov) return;
  cov.style.backgroundColor=b.color;
  const u=b.coverBig||b.coverUrl;
  if(u && cov.dataset.coverFor!==u){
    cov.dataset.coverFor=u; cov.style.backgroundImage=`url(${u})`; fitRatio(cov,u);
  }
  scope.querySelector(`[data-title="${b.id}"]`).textContent=b.title;
  const o=scope.querySelector(`[data-orig="${b.id}"]`);
  const showOrig=b.origTitle && b.origTitle!==b.title;
  o.hidden=!showOrig; o.textContent=showOrig?"Original title: "+b.origTitle:"";
  scope.querySelector(`[data-byline="${b.id}"]`).textContent=bylineText(b);
  fillMeta(scope.querySelector(`[data-meta="${b.id}"]`), b);
  const st=scope.querySelector(`[data-status="${b.id}"]`);
  if(st) st.textContent=statusText(b);      // a new page count moves the percentage
  const pr=scope.querySelector(`[data-pagerow="${b.id}"]`);
  if(pr){                                 // a new page count rescales the slider
    pr.querySelector("input[type=range]").max=b.pages||300;
    pr.querySelector(".mono").textContent=`p. ${b.page||0}/${b.pages||"?"}`;
  }
}

/* Shared by buildDetail and patchDetail so the two can't drift apart. */
const bylineText = b => [b.author, b.year, b.lang?(LANGS[b.lang]||b.lang):null, b.publisher].filter(Boolean).join(" · ");
function fillMeta(node,b){
  node.innerHTML="";
  [["Pages",b.pages||"—"],["ISBN",b.isbn||"—"],["Source",b.src?SOURCES[b.src].label:"—"],["Added",b.addedAt||"—"]]
    .forEach(([k,v])=>{ const r=el("div","row"); r.innerHTML=`<span>${k}</span><span class="mono">${esc(v)}</span>`; node.appendChild(r); });
}

/* ═══════════ shelf transitions ═══════════
   Lifted out of the detail panel because finishing a book now has two doors
   into it — the button and the date prompt — and two copies of a transition is
   how the two of them start disagreeing. Every one clears upNext: it means
   "next out of the To read queue", and a book that has left the queue cannot be
   next in it. The ones that discard a date the reader typed carry an Undo. */
function startReading(b){
  const again = b.shelf==="read" && !b.gaveUp;
  const prev = {shelf:b.shelf, gaveUp:b.gaveUp, started:b.started, finished:b.finished,
                finishedYear:b.finishedYear, page:b.page, upNext:!!b.upNext};
  b.shelf="reading"; b.gaveUp=false; b.upNext=false;
  b.started = again ? today() : (b.started||today());   // a re-read starts now
  if(again) b.page=0;
  b.finished=null; b.finishedYear=null;
  refresh(b);
  toast(again?"Reading again":"Reading now",
        again ? ()=>{ Object.assign(b,prev); refresh(b); } : null);
}
function finishReading(b){
  b.shelf="read"; b.gaveUp=false; b.upNext=false;
  /* Keep a date the reader typed. Stamping today over it is what made the
     Finished field feel like nothing was reading it — and it is what lets the
     button and the prompt below produce the same result. Since startReading
     clears both finish fields, anything here was entered during this reading. */
  if(!b.finished && !b.finishedYear) b.finished=today();
  if(b.pages) b.page=b.pages;              // unguarded, this wrote p. null/?
  refresh(b); toast("Logged in the register");
}
function giveUp(b){
  b.shelf="read"; b.gaveUp=true; b.upNext=false;
  if(!b.finished && !b.finishedYear) b.finished=today();
  refresh(b); toast("Logged as given up");
}
/* Clears the finish dates rather than carrying them onto a shelf of books you
   haven't read — otherwise the prompt below would ask, every time you opened
   it, whether the book you just filed as unread is read. */
function moveToRead(b){
  const prev={shelf:b.shelf, gaveUp:b.gaveUp, finished:b.finished,
              finishedYear:b.finishedYear, upNext:!!b.upNext};
  b.shelf="toread"; b.gaveUp=false; b.upNext=false; b.finished=null; b.finishedYear=null;
  refresh(b);
  toast("Moved to To read", ()=>{ Object.assign(b,prev); refresh(b); });
}

/* One line that says where the book stands, so the actions under it don't read
   as a quiz about which state it is in. Shared with patchDetail for the same
   reason bylineText is: two copies would drift. */
function statusText(b){
  const pages=b.pages||0, read=b.page||0;
  const pg = pages ? `p. ${read}/${pages} (${Math.round(read/pages*100)}%)` : null;
  const started=fmtDay(b.started), fin=fmtDay(b.finished);
  if(b.shelf==="reading")
    return ["Reading", started?`started ${started}`:null, pg].filter(Boolean).join(" · ");
  if(b.shelf==="toread"){
    const added=fmtDay(b.addedAt);
    return ["To read", b.upNext?"up next":null, added?`added ${added}`:null].filter(Boolean).join(" · ");
  }
  /* "Stopped", not "finished" — the register already keeps the two apart. */
  if(b.gaveUp){
    const when = fin ? `stopped ${fin}` : (b.finishedYear?`stopped in ${b.finishedYear}`:"no date on record");
    return ["Gave up", when, pages?`at p. ${read} of ${pages}`:null].filter(Boolean).join(" · ");
  }
  const when = fin ? `finished ${fin}` : (b.finishedYear?`finished in ${b.finishedYear}`:"no date on record");
  const days = (b.started&&b.finished)
    ? Math.max(1,Math.round((new Date(b.finished)-new Date(b.started))/864e5)) : null;
  return ["Read", when, days?`${days} day${days===1?"":"s"}`:null].filter(Boolean).join(" · ");
}

/* A toggle, not an action: it states a property of the book rather than doing
   something to it. The label stays put and the fill carries the state — a
   button whose words change is a button you have to read twice. aria-pressed
   is both the hook the CSS states on and what a screen reader announces, so
   the state is never carried by colour alone. */
function toggleBtn(label,on,fn){
  const t=el("button","tog");
  t.setAttribute("aria-pressed",String(!!on));
  t.textContent=label;
  t.onclick=()=>fn(t);
  return t;
}

function buildDetail(b){
  const wrap=el("div","detail");
  const left=el("div"), cov=el("div","coverslot");
  cov.dataset.cover=b.id;
  cov.style.backgroundColor=b.color;
  const covUrl=b.coverBig||b.coverUrl;
  if(covUrl){ cov.dataset.coverFor=covUrl; cov.style.backgroundImage=`url(${covUrl})`; fitRatio(cov,covUrl); }
  left.appendChild(cov);

  const right=el("div");
  const h=el("h2"); h.dataset.title=b.id; h.textContent=b.title;
  right.appendChild(h);
  /* Always in the DOM, hidden when empty, so an edition swap can reveal it
     without rebuilding the panel out from under whoever is typing a date. */
  const o=el("div","orig"); o.dataset.orig=b.id;
  const showOrig=b.origTitle && b.origTitle!==b.title;
  o.hidden=!showOrig; if(showOrig) o.textContent="Original title: "+b.origTitle;
  right.appendChild(o);

  const by=el("div","byline"); by.dataset.byline=b.id;
  by.textContent=bylineText(b);
  const blurb=el("p","blurb"); blurb.dataset.blurb=b.id;
  blurb.textContent=b.blurb||(b.ref?"Fetching description …":"No description.");
  right.append(by,blurb);

  const meta=el("div","meta"); meta.dataset.meta=b.id;
  fillMeta(meta,b);
  right.appendChild(meta);

  const statusNode=el("div","statusline mono"); statusNode.dataset.status=b.id;
  right.appendChild(statusNode);            // filled by syncPanelState below

  /* Everything the panel derives rather than stores. The date fields and the
     page slider deliberately never rebuild the panel, so anything downstream of
     them has to be told by hand — this is the surgical stand-in for refresh. */
  let priBtn=null, finDismissed=false;
  const syncStatus=()=>{ statusNode.textContent=statusText(b); };
  function syncFinishPrompt(){
    const stranded = b.shelf!=="read" && !!(b.finished||b.finishedYear);
    fp.hidden = !stranded || finDismissed;
    if(fp.hidden) return;
    const d=fmtDay(b.finished);
    fpTxt.textContent = d ? `Finished ${d} — move it to Read?`
                          : `Finished in ${b.finishedYear} — move it to Read?`;
  }
  /* At the last page, logging it is the obvious next step, so the button says
     so. It only gets louder — moving the book is still the reader's call. */
  function syncPrimaryUrge(){
    if(!priBtn) return;
    priBtn.classList.toggle("urge", b.shelf==="reading" && !!b.pages && (b.page||0)>=b.pages);
  }
  const syncPanelState=()=>{ syncStatus(); syncFinishPrompt(); syncPrimaryUrge(); };

  const df=el("div","datefix");
  [["Started","started"],["Finished","finished"]].forEach(([lab,key])=>{
    const l=el("label"); l.textContent=lab;
    const i=el("input"); i.type="date"; i.value=b[key]||"";
    /* save+render, not refresh — rebuilding the panel here would throw away
       the field you are still working in and the focus that goes with it. */
    i.onchange=()=>{ b[key]=i.value||null;
      if(key==="finished"){ if(i.value){ b.finishedYear=null; syncYear(); }
        finDismissed=false; }   // a new date is a new question
      save(); render(); syncPanelState(); };
    l.appendChild(i); df.appendChild(l);
  });
  const yl=el("label"); yl.textContent="Or just the year";
  const yi=el("input"); yi.type="number"; yi.min=1400; yi.max=2100; yi.placeholder="YYYY"; yi.inputMode="numeric";
  yi.value=b.finishedYear||"";
  /* The exact date and the bare year are mutually exclusive; clearing the
     other field on screen is what makes that visible instead of silent. */
  function syncYear(){ yi.value=b.finishedYear||""; }
  const fin=()=>df.querySelectorAll("input[type=date]")[1];
  yi.onchange=()=>{ b.finishedYear=yi.value?String(yi.value):null;
    if(b.finishedYear){ b.finished=null; fin().value=""; }
    finDismissed=false;
    save(); render(); syncPanelState(); };
  yl.appendChild(yi); df.appendChild(yl);
  right.appendChild(df);

  /* The dates say the book is finished and the shelf says it isn't. That is an
     inconsistency the app noticed, not a decision it gets to make, so it states
     the fact and offers the move instead of performing it. Always in the DOM
     and merely hidden, like .orig above, because the field that raises it must
     not be rebuilt out from under the reader mid-entry. */
  const fp=el("div","confirm"); fp.dataset.finprompt=b.id; fp.hidden=true;
  const fpTxt=el("span","ctext");
  /* Not .sig: the strip already carries the accent in its border and its tint,
     and the panel is only allowed one orange button — which, while the strip is
     up, would otherwise be a second copy of this same action. */
  const fpYes=el("button","act"); fpYes.textContent="Move to Read";
  fpYes.onclick=()=>finishReading(b);
  const fpNo=el("button","act quiet"); fpNo.textContent="Not yet";
  /* Dismissal lives and dies with this panel. It suppresses a real data
     inconsistency, so a stored "don't ask" would hide it for good on one stray
     tap; editing the date brings it straight back. */
  fpNo.onclick=()=>{ finDismissed=true; fp.hidden=true; };
  fp.append(fpTxt,fpYes,fpNo);
  right.appendChild(fp);

  if(b.shelf==="reading"||b.gaveUp){
    const pr=el("div","pagerow"); pr.dataset.pagerow=b.id;
    const lbl=el("span","mono"); lbl.style.minWidth="78px"; lbl.textContent=`p. ${b.page||0}/${b.pages||"?"}`;
    const range=el("input"); range.type="range"; range.min=0; range.max=b.pages||300; range.value=b.page||0;
    range.oninput=()=>{ b.page=+range.value; lbl.textContent=`p. ${b.page}/${b.pages||"?"}`;
      syncPanelState(); };
    range.onchange=()=>{ save(); render(); };
    pr.append(lbl,range); right.appendChild(pr);
  }

  /* One orange thing in the panel, and it always answers the same question:
     what do I do with this book next. Everything else steps back. */
  const quiet=(box,txt,fn)=>{ const x=el("button","act quiet"); x.textContent=txt; x.onclick=fn; box.appendChild(x); return x; };
  const acts=el("div","acts");
  const [priTxt,priFn] =
      b.shelf==="toread"  ? ["Start reading",   ()=>startReading(b)]
    : b.shelf==="reading" ? ["Finished reading",()=>finishReading(b)]
    : b.gaveUp            ? ["Pick it up again",()=>startReading(b)]
    :                       ["Read it again",   ()=>startReading(b)];
  priBtn=el("button","act sig"); priBtn.textContent=priTxt; priBtn.onclick=priFn;
  acts.appendChild(priBtn);
  /* Adding replaces the panel in place, so without a way back the flow dead
     ends and entering a backlog means starting over for every single book.
     Next to the primary, because straight after an add it is the likeliest tap
     after it. */
  if(b.id===justAdded && lastEntry==="manual") quiet(acts,"＋ Enter another",()=>manualPanel(""));
  else if(b.id===justAdded && lastQuery) quiet(acts,"← Back to results",()=>searchPanel(lastQuery));
  right.appendChild(acts);

  // the other ways off this shelf
  const moves=el("div","acts second");
  if(b.shelf==="reading") quiet(moves,"Give up",()=>giveUp(b));
  if(b.shelf!=="toread")  quiet(moves,"→ To read",()=>moveToRead(b));
  if(moves.children.length) right.appendChild(moves);

  // what the book is, rather than what to do with it
  const togs=el("div","acts second");
  togs.appendChild(toggleBtn("Recommend", b.rec, t=>{
    /* No refresh: nothing about the panel's shape depends on either flag, and a
       rebuild would cost the scroll position and the note you were typing. */
    b.rec=!b.rec; t.setAttribute("aria-pressed",String(b.rec)); save(); render();
  }));
  if(b.shelf==="toread") togs.appendChild(toggleBtn("Up next", !!b.upNext, t=>{
    b.upNext=!b.upNext; t.setAttribute("aria-pressed",String(b.upNext));
    save(); render(); syncStatus();
  }));
  right.appendChild(togs);

  right.appendChild(buildNotes(b));

  /* Notes and quotes are what you came for; editing the record and deleting it
     are administration. Below the rule at the very bottom is where the eye
     stops looking, which is exactly where Remove belongs. */
  const keep=el("div","keep");
  if(b.ref && b.src && SOURCES[b.src].canEditions) quiet(keep,"Change edition",()=>openEditions(b));
  quiet(keep,"Remove",()=>{
    const idx=books.indexOf(b); lastRemoved={b,idx};
    books=books.filter(x=>x.id!==b.id); save(); render(); closePanel();
    toast("Removed", ()=>{ books.splice(lastRemoved.idx,0,lastRemoved.b); save(); render(); });
  }).classList.add("danger");
  right.appendChild(keep);

  syncPanelState();          // also catches a book already stranded in storage

  wrap.append(left,right);
  return wrap;
}

/* ═══════════ notes and quotes ═══════════ */
const hasNotes = b => !!((b.note||"").trim() || (b.quotes||[]).length);

function buildNotes(b){
  const box=el("div","notes");
  const h=el("div","sechead"); h.textContent="Notes"; box.appendChild(h);

  const ta=el("textarea","notefield");
  ta.placeholder="What you want to remember about this one.";
  ta.value=b.note||"";
  ta.setAttribute("aria-label","Note about this book");
  /* Save while typing but never re-render: a render would repaint the shelf
     behind, and refresh would take the textarea out from under the cursor.
     The shelf mark can wait until you leave the field. */
  let t;
  ta.oninput=()=>{ b.note=ta.value; clearTimeout(t); t=setTimeout(save,500); };
  ta.onchange=()=>{ b.note=ta.value; clearTimeout(t); save(); render(); };
  box.appendChild(ta);

  const qh=el("div","sechead"); qh.style.marginTop="18px"; qh.textContent="Quotes";
  box.appendChild(qh);
  const list=el("div","qlist"); box.appendChild(list);

  function drawQuotes(){
    list.innerHTML="";
    (b.quotes||[]).forEach((q,i)=>{
      const row=el("div","q");
      const p=el("div","qp"); p.textContent=q.page?`p. ${q.page}`:"—";
      const txt=el("div","qt"); txt.textContent=q.text;
      const x=el("button","qx"); x.textContent="✕";
      x.setAttribute("aria-label",`Remove quote from page ${q.page||"unknown"}`);
      x.onclick=()=>{ b.quotes.splice(i,1); save(); render(); drawQuotes(); };
      row.append(p,txt,x); list.appendChild(row);
    });
  }
